# Desktop CI — native client (Rust + iced, no webview) + native installer.
#
# Runs only when the desktop app, the installer, or this workflow
# changes.
#   fmt      — cargo fmt --check (desktop + installer)
#   clippy   — cargo clippy -- -D warnings (desktop + installer)
#   test     — cargo test (desktop unit tests; installer unit tests
#              for the file steps — the registry/shortcut steps are
#              Windows-only and run on windows-latest)
#   build    — cargo build --release on windows-latest for the app,
#              then the installer (the app exe is embedded as its
#              payload), then `puspabot-setup.exe --self-test`:
#              a headless install to a temp dir, file verification,
#              uninstall, removal verification — the real installer
#              exercised on the real runner.
# The Windows installer cannot be built on the Linux dev VM; CI is
# the only place it is produced. The database decision for v1 is
# made (full SQLite port, Nero 23 Nov ~09:52 WIB); the installer
# installs no database — the backend creates its SQLite file on
# first run. The old NSIS installer (windows.nsi) was replaced by
# the native installer crate in apps/installer on 23 Nov 2026:
# NSIS had an ugly default UI, no auto-launch, and no progress bar.

name: desktop

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/desktop/**"
      - "apps/installer/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/installer/**"
      - ".github/workflows/desktop.yml"

jobs:
  rust-check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            apps/installer
      - name: fmt
        working-directory: apps/desktop
        run: cargo fmt --check
      - name: fmt (installer)
        working-directory: apps/installer
        run: cargo fmt --check
      - name: clippy
        working-directory: apps/desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (installer)
        working-directory: apps/installer
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: apps/desktop
        run: cargo test
      - name: test (installer)
        working-directory: apps/installer
        run: cargo test

  build-windows:
    name: Windows release + native installer
    runs-on: windows-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            apps/installer
      - name: build app release
        working-directory: apps/desktop
        run: cargo build --release
      - name: build installer release
        # The app exe is embedded as the installer payload.
        working-directory: apps/installer
        env:
          PUSPA_APP_EXE: ${{ github.workspace }}\apps\desktop\target\release\puspabot.exe
        run: cargo build --release
      - name: verify installer inputs
        # Fail here with a clear name when an input is missing, so a
        # later failure cannot be a missing file in disguise.
        run: |
          foreach ($p in @("apps\desktop\target\release\puspabot.exe", "apps\installer\target\release\puspabot-setup.exe")) {
            if (-not (Test-Path $p)) { Write-Error "missing installer input: $p"; exit 1 }
          }
          Write-Host "all installer inputs present"
      - name: installer self-test
        # Headless end-to-end on the real runner: install to a temp
        # dir, verify files + registry + shortcuts, uninstall,
        # verify removal. Exit 0 means the installer works.
        run: |
          .\apps\installer\target\release\puspabot-setup.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: puspabot-windows-installer
          path: apps/installer/target/release/puspabot-setup.exe
          if-no-files-found: error
