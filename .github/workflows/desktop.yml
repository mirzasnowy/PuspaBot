# Desktop CI — native client (Rust + iced, no webview).
#
# Runs only when the desktop app or this workflow changes.
#   fmt      — cargo fmt --check
#   clippy   — cargo clippy -- -D warnings
#   test     — cargo test (unit tests: lifecycle manager, API client)
#   build    — cargo build --release on windows-latest, then NSIS
#              installer (makensis is preinstalled on the runner).
# The Windows installer cannot be built on the Linux dev VM; CI is
# the only place it is produced. The database decision for v1 is
# made (full SQLite port, Nero 23 Nov ~09:52 WIB); the installer
# installs no database — the backend creates its SQLite file on
# first run.

name: desktop

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  rust-check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: fmt
        working-directory: apps/desktop
        run: cargo fmt --check
      - name: clippy
        working-directory: apps/desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: apps/desktop
        run: cargo test

  build-windows:
    name: Windows release + NSIS installer
    runs-on: windows-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: build release
        working-directory: apps/desktop
        run: cargo build --release
      - name: Create installer output directory
        # makensis does not create the output directory itself: with
        # no installer-out it fails with "Can't open output file".
        run: New-Item -ItemType Directory -Force -Path installer-out

      - name: NSIS installer
        run: makensis /DOUTDIR=${{ github.workspace }}\installer-out apps\desktop\installer\windows.nsi
      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: puspabot-windows-installer
          path: installer-out/PuspaBot-Setup.exe
          if-no-files-found: error
