# CI — one workflow, per-area lanes, one aggregate gate.
#
# Design (hermes-agent orchestrator pattern, in miniature): detect-changes
# runs once up front, the lanes have no triggers of their own, and a
# single aggregate gate job (`all-checks-pass`) is the only required check
# for branch protection. A lane is skipped when nothing changed in its
# area (the gate treats a skipped lane as fine); a push that changes
# Python code, dependencies, or the workflow itself runs every lane.
#
# Lanes:
#   changes  — detect-changes: which areas the push/PR touched
#              (python code/deps/workflow vs docs). Every other lane
#              waits for it.
#   test     — the full suite, SOLO (one pytest process, no parallel
#              runner), against Postgres 16 + pgvector, with
#              infra/schema_core.sql applied first.
#   sandbox  — the live container + Chromium tests that can never run
#              on the dev VM (its kernel rejects container namespaces):
#              the 4 live tests in tests/test_sandbox.py, the Docker
#              backend conformance tests in
#              tests/test_computer_backends.py, and the Chromium reader
#              test in tests/test_readers.py. Runs on ubuntu-24.04,
#              whose runner image ships Docker (actions/runner-images);
#              the lane builds infra/sandbox.Dockerfile first, because
#              the runner's default image (puspa-sandbox:3.12-local)
#              is built locally on the dev VM and is on no registry,
#              and installs Chromium with `playwright install
#              --with-deps chromium`. A final step parses the JUnit
#              XML and fails the lane if any of those live tests
#              skipped, so a broken image or browser can never
#              silently turn the lane back into skips. Needs the same
#              Postgres service as the test lane, because the shared
#              tests/conftest.py fixture creates schemas for every
#              test file in this directory.
#   checks   — dependency-light checks that need no database: the
#              file-size ratchet and the docs-drift test, plus a parse
#              check of this workflow file itself.
#   lint     — ruff check (lint rules in pyproject.toml [tool.ruff.lint]).
#   format   — ruff format --check (width and style in pyproject.toml
#              [tool.ruff]).
#   typecheck — mypy over puspa, tests, and demo (config in
#              pyproject.toml [tool.mypy]).
#
# A separate scheduled workflow, .github/workflows/nightly-smoke.yml
# (E-04), runs the live smoke lane once a day with low-capped keys
# and test accounts. It is not a lane here: it needs real keys,
# real accounts, and a local Ollama server.
#
# The lint and format lanes install only requirements-dev.txt (fast: no
# torch). The typecheck lane installs requirements.txt too, because mypy
# needs the runtime dependencies to resolve imports.
#
# Honest limit: this workflow cannot be executed end-to-end on the
# development VM (no Docker, no GitHub runner there). It is correct by
# construction — YAML validated, every referenced command checked
# (including the checks lane, which installs the pytest and PyYAML it
# actually runs) — and its first real run happens on GitHub. That
# applies to the sandbox lane too: Docker on the ubuntu-24.04 runner
# is verified against the runner image (actions/runner-images), but
# the lane itself has never run on GitHub yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on a PR branch, but never cancel a run on main
# (a main run that is cancelled leaves the branch state unverified).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect-changes, hermes style: one job up front, every lane reads it.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.detect.outputs.python }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: detect
        run: |
          # Base for the diff: the PR base for pull requests, the
          # previous commit for pushes. When the base is unknown or
          # not in this clone (new branch, workflow_dispatch,
          # multi-commit push), assume everything changed so all
          # lanes run.
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --depth 1 origin "$BASE" 2>/dev/null || BASE=""
          else
            BASE="${{ github.event.before }}"
          fi
          FILES="__ALL__"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null) && FILES="$DIFF"
          fi
          PYTHON=false
          DOCS=false
          if [ "$FILES" = "__ALL__" ]; then
            PYTHON=true
            DOCS=true
          else
            echo "$FILES" | grep -qE '\.py$|requirements.*\.txt$|pyproject\.toml$|^infra/|^.github/' && PYTHON=true
            echo "$FILES" | grep -qE '\.md$|^docs/' && DOCS=true
          fi
          echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "changed files:"
          echo "$FILES"

  test:
    name: Full suite (SOLO)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: puspa-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway password for the ephemeral CI test database only; the
      # database is created fresh per run and destroyed with the runner.
      PUSPA_TEST_DSN: dbname=puspa_test user=root password=puspa-ci-test host=localhost port=5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Set up test database
        env:
          PGPASSWORD: puspa-ci-test
        run: |
          psql "host=localhost user=postgres dbname=postgres" -f infra/schema_core.sql
          # The suite connects as role root over TCP; give that role the
          # same throwaway password as the service superuser. Local runs
          # use peer auth instead and need no password (see
          # docs/verification.md).
          psql "host=localhost user=postgres dbname=postgres" -c "ALTER ROLE root WITH PASSWORD 'puspa-ci-test';"

      - name: Run the full suite (SOLO, no parallel runner)
        run: python -m pytest

  sandbox:
    name: Sandbox + Chromium (live containers)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: puspa-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUSPA_TEST_DSN: dbname=puspa_test user=root password=puspa-ci-test host=localhost port=5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements.txt already pins playwright (the Chromium
        # reader test drives it); nothing extra is needed for Docker,
        # which ships in the ubuntu-24.04 runner image.
        run: python -m pip install -r requirements.txt

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Set up test database
        env:
          PGPASSWORD: puspa-ci-test
        run: |
          psql "host=localhost user=postgres dbname=postgres" -f infra/schema_core.sql
          # Same as the test lane: the suite connects as role root
          # over TCP, so give that role the same throwaway password
          # as the service superuser.
          psql "host=localhost user=postgres dbname=postgres" -c "ALTER ROLE root WITH PASSWORD 'puspa-ci-test';"

      - name: Build the sandbox image
        run: |
          # The runner's default image (puspa-sandbox:3.12-local) is
          # built locally on the dev VM with `docker import` and is on
          # no registry, so without this step check_available() stays
          # False and the live tests would skip here too.
          # infra/sandbox.Dockerfile rebuilds the same image from the
          # public python:3.12-slim base (stock CPython only).
          docker build -f infra/sandbox.Dockerfile -t puspa-sandbox:3.12-local .
          docker run --rm puspa-sandbox:3.12-local /usr/bin/python3.12 -c 'print("sandbox-image-ok")'

      - name: Install Chromium for Playwright
        run: |
          # Downloads the browser the Chromium reader test drives.
          # The test finds the Playwright-managed binary itself, and
          # still skips honestly on a host without one.
          python -m playwright install --with-deps chromium

      - name: Run the live container + Chromium tests
        run: python -m pytest tests/test_sandbox.py tests/test_computer_backends.py tests/test_readers.py -v --junitxml=sandbox-tests.xml

      - name: Fail if a live test skipped
        run: |
          # A skip here means the lane is not doing its job (missing
          # image, dead daemon, missing browser). The lane must fail
          # loudly instead of going green on skips.
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          LIVE_TESTS = [
              "test_run_print_ok_in_container",
              "test_failed_run_code_still_returns_result_not_unavailable",
              "test_run_network_to_domain_outside_allowlist_rejected",
              "test_run_cannot_write_to_host",
              "test_playwright_reader_reads_test_site_when_browser_exists",
          ]

          # Two docker conformance tests skip by design even on a
          # Docker host (the backend has no persistent filesystem,
          # so sync is refused, not exercised); every other [docker]
          # test must run.
          DOCKER_SYNC_SKIPS = {
              "test_sync_write_read_roundtrip[docker]",
              "test_sync_write_outside_scope_is_refused[docker]",
          }

          tree = ET.parse("sandbox-tests.xml")
          cases = {
              case.get("name"): case
              for case in tree.getroot().iter("testcase")
          }
          problems = []
          for name in LIVE_TESTS:
              case = cases.get(name)
              if case is None:
                  problems.append(f"missing (not collected): {name}")
              elif case.find("skipped") is not None:
                  problems.append(f"skipped: {name}")
          for name, case in cases.items():
              if (
                  name.endswith("[docker]")
                  and name not in DOCKER_SYNC_SKIPS
                  and case.find("skipped") is not None
              ):
                  problems.append(f"skipped: docker backend conformance {name}")
          if problems:
              print("sandbox lane: the live tests must RUN, not skip:")
              print("\n".join(f"  - {item}" for item in problems))
              sys.exit(1)
          print("sandbox lane: all live container + Chromium tests ran (none skipped)")
          EOF

  checks:
    name: Ratchet + docs drift (no database)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what this lane actually runs
        # test_docs_drift.py imports puspa.ledger, which needs psycopg
        # installed but opens no connection. The ratchet test needs only
        # the standard library. pytest runs both, and PyYAML parses this
        # workflow file below. (Before 18 Nov 2026 this step installed
        # only psycopg, so the lane would have failed on GitHub with
        # "No module named pytest" / "No module named yaml".)
        run: python -m pip install "pytest==9.2.0" "psycopg[binary]==3.3.9" "pyyaml==6.0.3"

      - name: Run the ratchet and drift tests
        run: python -m pytest tests/test_file_size_ratchet.py tests/test_docs_drift.py --noconftest -q

      - name: Check this workflow file parses
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('ci.yml parses')"

  lint:
    name: Lint (ruff check)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools only (no torch, fast)
        run: python -m pip install -r requirements-dev.txt

      - name: Run ruff check (rules in pyproject.toml)
        run: ruff check puspa tests demo

  format:
    name: Format check (ruff format)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools only (no torch, fast)
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting (style in pyproject.toml)
        run: ruff format --check puspa tests demo

  typecheck:
    name: Typecheck (mypy)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev dependencies
        # mypy needs the runtime dependencies installed to resolve
        # imports (nanobot, psycopg, fastembed, ...), plus the dev
        # tools themselves. Same install as the test lane, plus the
        # dev file; the torch install makes this lane slow on its
        # first run, like the test lane.
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy (config in pyproject.toml)
        run: python -m mypy puspa tests demo

  # Single aggregate gate: the only check branch protection needs.
  # A skipped lane is fine (nothing changed in its area); only a
  # failure or a cancellation fails the gate.
  all-checks-pass:
    name: All checks pass
    needs: [changes, test, sandbox, checks, lint, format, typecheck]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every lane passed
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.test.result }}" "${{ needs.sandbox.result }}" "${{ needs.checks.result }}" "${{ needs.lint.result }}" "${{ needs.format.result }}" "${{ needs.typecheck.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "a lane failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "all lanes passed (skipped lanes are fine: nothing changed in their area)"
