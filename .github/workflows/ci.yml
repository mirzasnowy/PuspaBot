# CI — one workflow, per-area lanes, one aggregate gate.
#
# Design (hermes-agent orchestrator pattern, in miniature): detect-changes
# runs once up front, the lanes have no triggers of their own, and a
# single aggregate gate job (`all-checks-pass`) is the only required check
# for branch protection. A lane is skipped when nothing changed in its
# area (the gate treats a skipped lane as fine); a push that changes
# Python code, dependencies, or the workflow itself runs every lane.
#
# Lanes:
#   changes  — detect-changes: which areas the push/PR touched
#              (python code/deps/workflow vs docs). Every other lane
#              waits for it.
#   test     — the full suite on 4 xdist workers (E-17, plan 9.1),
#              each with its own database cloned from a migrated
#              template (tests/worker_db.py), excluding the live
#              tests (``-m "not live"``). The live tests run in the
#              sandbox lane instead. Target: under 10 minutes.
#   pr-lane  — pull requests only: the affected tests only (E-17),
#              computed from Puspa's own import graph
#              (scripts/affected.py + scripts/pr_lane.py), on the
#              same 4-worker setup as the test lane. Target: under
#              8 minutes. A change that shapes every test (conftest,
#              migrations, CI config) runs the full suite instead.
#   npm-wrapper — the npm install wrapper tests
#              (tests/test_npm_wrapper.py) on ubuntu, windows, and
#              macOS. The wrapper must install and run on all three:
#              the postinstall fallback chain and the `puspa` shim
#              are OS-sensitive (PEP 668 on Linux, the `py` launcher
#              and `.cmd` shims on Windows), so a Linux-only run
#              proves nothing about the other two.
#   sandbox  — the live container + Chromium tests that can never run
#              on the dev VM (its kernel rejects container namespaces):
#              the 4 live tests in tests/test_sandbox.py, the Docker
#              backend conformance tests in
#              tests/test_computer_backends.py, and the Chromium reader
#              test in tests/test_readers.py. Runs on ubuntu-24.04,
#              whose runner image ships Docker (actions/runner-images);
#              the lane builds infra/sandbox.Dockerfile first, because
#              the runner's default image (puspa-sandbox:3.12-local)
#              is built locally on the dev VM and is on no registry,
#              and installs Chromium with `playwright install
#              --with-deps chromium`. It also builds the deploy image
#              (Dockerfile, E-05) and runs the image smoke test in
#              tests/test_image_smoke.py, which runs that image and
#              checks /app serves the React bundle. A final step
#              parses the JUnit XML and fails the lane if any of those
#              live tests skipped, so a broken image or browser can
#              never silently turn the lane back into skips. Needs the
#              same Postgres service as the test lane, because the
#              shared tests/conftest.py fixture creates schemas for
#              every test file in this directory.
#   checks   — dependency-light checks that need no database: the
#              file-size ratchet, the blind-except ratchet (E-20) and
#              the bandit baseline ratchet (E-20), plus the docs-drift
#              test and a parse check of this workflow file itself.
#   supply-chain — dependency + secret hygiene (E-12, plan 6.7/6.8):
#              the hashed requirements file is in sync with
#              requirements.txt (uv pip compile --generate-hashes),
#              pip-audit over the hashed file, a CycloneDX SBOM, and
#              a gitleaks scan over the full git history (needs
#              fetch-depth 0; false positives are allowlisted by
#              fingerprint in .gitleaks.toml).
#   lint     — ruff check (lint rules in pyproject.toml [tool.ruff.lint]).
#   format   — ruff format --check (width and style in pyproject.toml
#              [tool.ruff]).
#   typecheck — mypy over puspa, tests, and demo (config in
#              pyproject.toml [tool.mypy]).
#
# A separate scheduled workflow, .github/workflows/nightly-smoke.yml
# (E-04), runs the live smoke lane once a day with low-capped keys
# and test accounts. It is not a lane here: it needs real keys,
# real accounts, and a local Ollama server.
#
# The lint and format lanes install only requirements-dev.txt (fast: no
# torch). The typecheck lane installs requirements.txt too, because mypy
# needs the runtime dependencies to resolve imports.
#
# Honest limit: this workflow cannot be executed end-to-end on the
# development VM (no Docker, no GitHub runner there). It is correct by
# construction — YAML validated, every referenced command checked
# (including the checks lane, which installs the pytest and PyYAML it
# actually runs) — and its first real run happens on GitHub. That
# applies to the sandbox lane too: Docker on the ubuntu-24.04 runner
# is verified against the runner image (actions/runner-images), but
# the lane itself has never run on GitHub yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on a PR branch, but never cancel a run on main
# (a main run that is cancelled leaves the branch state unverified).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect-changes, hermes style: one job up front, every lane reads it.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.detect.outputs.python }}
      docs: ${{ steps.detect.outputs.docs }}
      wrapper: ${{ steps.detect.outputs.wrapper }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: detect
        run: |
          # Base for the diff: the PR base for pull requests, the
          # previous commit for pushes. When the base is unknown or
          # not in this clone (new branch, workflow_dispatch,
          # multi-commit push), assume everything changed so all
          # lanes run.
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --depth 1 origin "$BASE" 2>/dev/null || BASE=""
          else
            BASE="${{ github.event.before }}"
          fi
          FILES="__ALL__"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null) && FILES="$DIFF"
          fi
          PYTHON=false
          DOCS=false
          WRAPPER=false
          if [ "$FILES" = "__ALL__" ]; then
            PYTHON=true
            DOCS=true
            WRAPPER=true
          else
            echo "$FILES" | grep -qE '\.py$|\.sql$|requirements.*\.txt$|pyproject\.toml$|^infra/|^.github/' && PYTHON=true
            echo "$FILES" | grep -qE '\.md$|^docs/' && DOCS=true
            echo "$FILES" | grep -qE '^bin/|package\.json$|tests/test_npm_wrapper\.py$|^\.github/workflows/ci\.yml$' && WRAPPER=true
          fi
          echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "changed files:"
          echo "$FILES"

  test:
    name: Full suite (4 workers, per-worker DBs)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: puspa-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway password for the ephemeral CI test database only; the
      # database is created fresh per run and destroyed with the runner.
      PUSPA_TEST_DSN: dbname=puspa_test user=root password=puspa-ci-test host=localhost port=5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Entry-point tests (for example the puspa-token-app resolution
      # test) read the installed console-script metadata, which only
      # exists once the package itself is installed; requirements
      # alone do not install it.
      - name: Install the puspa package (editable)
        run: python -m pip install -e . --no-deps

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Set up test database
        env:
          PGPASSWORD: puspa-ci-test
        run: |
          # The suite connects as role root over TCP; create that role
          # as the service superuser, then build the migrated template
          # database the 4 workers clone from (E-17: the old
          # `python -m puspa.migrations up` against puspa_test is
          # gone; the template is the only schema path now, and each
          # worker gets its own database from it).
          psql "host=localhost user=postgres dbname=postgres" -c "CREATE ROLE root LOGIN SUPERUSER;"
          # The suite connects as role root over TCP, so give that role
          # the same throwaway password as the service superuser. Local
          # runs use peer auth instead and need no password (see
          # docs/verification.md).
          psql "host=localhost user=postgres dbname=postgres" -c "ALTER ROLE root WITH PASSWORD 'puspa-ci-test';"
          python scripts/setup_test_db.py

      - name: Run the full suite (4 workers, per-worker DBs, no live tests)
        run: python -m pytest -n 4 -m "not live" --dist loadfile

  pr-lane:
    name: PR lane (affected tests only)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: puspa-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUSPA_TEST_DSN: dbname=puspa_test user=root password=puspa-ci-test host=localhost port=5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Entry-point tests (for example the puspa-token-app resolution
      # test) read the installed console-script metadata, which only
      # exists once the package itself is installed; requirements
      # alone do not install it.
      - name: Install the puspa package (editable)
        run: python -m pip install -e . --no-deps

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Set up test database
        env:
          PGPASSWORD: puspa-ci-test
        run: |
          # Same setup as the test lane: role root, then the
          # migrated template the workers clone from (E-17).
          psql "host=localhost user=postgres dbname=postgres" -c "CREATE ROLE root LOGIN SUPERUSER;"
          psql "host=localhost user=postgres dbname=postgres" -c "ALTER ROLE root WITH PASSWORD 'puspa-ci-test';"
          python scripts/setup_test_db.py

      - name: Run the PR lane (affected tests, 4 workers)
        run: |
          # The base commit needs fetching: checkout only has the
          # last 2 commits (same pattern as the changes job).
          # pr_lane.py diffs base...head (three-dot), which needs a
          # merge base: a depth-1 fetch of the base leaves it
          # disconnected when main moved past the PR's fork point, so
          # unshallow the clone first (history is small post-scrub)
          # and fall back to the old depth-1 fetch if that fails.
          BASE="${{ github.event.pull_request.base.sha }}"
          git fetch --unshallow origin 2>/dev/null || git fetch --depth 1 origin "$BASE" 2>/dev/null || true
          python scripts/pr_lane.py --base "$BASE" --head "${{ github.sha }}"

  npm-wrapper:
    name: NPM wrapper tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.wrapper == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Entry-point tests read the installed console-script metadata,
      # which only exists once the package itself is installed.
      - name: Install the puspa package (editable)
        run: python -m pip install -e . --no-deps

      - name: Run the npm wrapper tests
        run: python -m pytest tests/test_npm_wrapper.py -v

  sandbox:
    name: Sandbox + Chromium (live containers)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: puspa-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUSPA_TEST_DSN: dbname=puspa_test user=root password=puspa-ci-test host=localhost port=5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements.txt already pins playwright (the Chromium
        # reader test drives it); nothing extra is needed for Docker,
        # which ships in the ubuntu-24.04 runner image.
        run: python -m pip install -r requirements.txt

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Set up test database
        env:
          PGPASSWORD: puspa-ci-test
        run: |
          # The suite connects as role root over TCP; create that role
          # and the test database as the service superuser, then apply
          # the schema with the migration runner (E-08: the old
          # infra/schema_core.sql setup script is gone; the runner is
          # the only schema path now).
          psql "host=localhost user=postgres dbname=postgres" -c "CREATE ROLE root LOGIN SUPERUSER;" -c "CREATE DATABASE puspa_test OWNER root;"
          # Same as the test lane: the suite connects as role root
          # over TCP, so give that role the same throwaway password
          # as the service superuser.
          psql "host=localhost user=postgres dbname=postgres" -c "ALTER ROLE root WITH PASSWORD 'puspa-ci-test';"
          python -m puspa.migrations up

      - name: Build the sandbox image
        run: |
          # The runner's default image (puspa-sandbox:3.12-local) is
          # built locally on the dev VM with `docker import` and is on
          # no registry, so without this step check_available() stays
          # False and the live tests would skip here too.
          # infra/sandbox.Dockerfile rebuilds the same image from the
          # public python:3.12-slim base (stock CPython only).
          docker build -f infra/sandbox.Dockerfile -t puspa-sandbox:3.12-local .
          docker run --rm puspa-sandbox:3.12-local /usr/bin/python3.12 -c 'print("sandbox-image-ok")'

      - name: Build the deploy image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          # E-05: the deploy image (Dockerfile) builds the React SPA
          # in its Node stage and copies dist into the runtime stage.
          # The image smoke test below runs this image and checks
          # /app serves the React bundle. The build installs the full
          # requirements.txt (torch included), so it takes minutes.
          docker build -t puspa:local .

      - name: Install Chromium for Playwright
        run: |
          # Downloads the browser the Chromium reader test drives.
          # The test finds the Playwright-managed binary itself, and
          # still skips honestly on a host without one.
          python -m playwright install --with-deps chromium

      - name: Run the live container + Chromium tests
        run: python -m pytest tests/test_sandbox.py tests/test_computer_backends.py tests/test_readers.py tests/test_image_smoke.py -v --junitxml=sandbox-tests.xml

      - name: Fail if a live test skipped
        run: |
          # A skip here means the lane is not doing its job (missing
          # image, dead daemon, missing browser). The lane must fail
          # loudly instead of going green on skips.
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          LIVE_TESTS = [
              "test_run_print_ok_in_container",
              "test_failed_run_code_still_returns_result_not_unavailable",
              "test_run_network_to_domain_outside_allowlist_rejected",
              "test_run_cannot_write_to_host",
              "test_playwright_reader_reads_test_site_when_browser_exists",
              "test_image_smoke_live",
          ]

          # Two docker conformance tests skip by design even on a
          # Docker host (the backend has no persistent filesystem,
          # so sync is refused, not exercised); every other [docker]
          # test must run.
          DOCKER_SYNC_SKIPS = {
              "test_sync_write_read_roundtrip[docker]",
              "test_sync_write_outside_scope_is_refused[docker]",
          }

          tree = ET.parse("sandbox-tests.xml")
          cases = {
              case.get("name"): case
              for case in tree.getroot().iter("testcase")
          }
          problems = []
          for name in LIVE_TESTS:
              case = cases.get(name)
              if case is None:
                  problems.append(f"missing (not collected): {name}")
              elif case.find("skipped") is not None:
                  problems.append(f"skipped: {name}")
          for name, case in cases.items():
              if (
                  name.endswith("[docker]")
                  and name not in DOCKER_SYNC_SKIPS
                  and case.find("skipped") is not None
              ):
                  problems.append(f"skipped: docker backend conformance {name}")
          if problems:
              print("sandbox lane: the live tests must RUN, not skip:")
              print("\n".join(f"  - {item}" for item in problems))
              sys.exit(1)
          print("sandbox lane: all live container + Chromium tests ran (none skipped)")
          EOF

  checks:
    name: Ratchets + docs drift (no database)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what this lane actually runs
        # test_docs_drift.py imports puspa.ledger, which needs psycopg
        # installed but opens no connection; the ledger import chain
        # also reaches puspa.vault, which needs cryptography, and the
        # accounts ports, which need argon2. The ratchet tests need
        # only the standard library plus the tools they shell out to: the blind-except ratchet runs the ruff
        # binary and the bandit baseline ratchet runs bandit (E-20,
        # plan section 9.5; both pinned to the versions in
        # requirements-dev.txt, against which their baselines were
        # measured). pytest runs the tests, and PyYAML parses this
        # workflow file below. (Before 18 Nov 2026 this step installed
        # only psycopg, so the lane would have failed on GitHub with
        # "No module named pytest" / "No module named yaml".)
        run: python -m pip install "pytest==9.2.0" "psycopg[binary]==3.3.9" "pyyaml==6.0.3" "ruff==0.17.5" "bandit==1.8.6" "cryptography==50.0.2" "argon2-cffi==25.1.0"

      - name: Run the ratchet and drift tests
        run: python -m pytest tests/test_file_size_ratchet.py tests/test_blind_except_ratchet.py tests/test_bandit_baseline.py tests/test_docs_drift.py --noconftest -q

      - name: Check this workflow file parses
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('ci.yml parses')"

  supply-chain:
    name: Supply chain (hashes, audit, SBOM, gitleaks)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the whole history, not just the checkout.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        # uv (hashed-file sync check), pip-audit, cyclonedx-bom.
        # Pinned like the dev tools so the lane is reproducible.
        run: python -m pip install "uv==0.13.9" "pip-audit==2.10.1" "cyclonedx-bom==9.0.0"

      - name: Check the hashed requirements file is in sync
        # Regenerate in place, then fail on any diff: any drift
        # between requirements.txt and requirements-hashed.txt
        # fails the lane. Regenerate with the same command after
        # any dependency change. (uv 0.13.9 has no --check flag,
        # and regenerating to a different path changes the header
        # comment, so a temp-file diff would always mismatch.)
        run: |
          uv pip compile requirements.txt --python-version 3.12 --generate-hashes -o requirements-hashed.txt
          git diff --exit-code -- requirements-hashed.txt

      - name: Audit dependencies (pip-audit)
        # Audits the exact pinned tree in requirements-hashed.txt
        # (uv's fresh resolution: starlette 1.10.0, which resolves
        # the 0.46.2 conflict the venv still carries). The nanobot
        # line is filtered out first: pip cannot hash-verify a
        # version-control checkout, so `pip-audit -r` refuses any
        # file that hashes one — nanobot-ai's integrity comes from
        # its git commit pin instead (see requirements.txt). A
        # known vulnerability fails the lane: fix it (bump the pin
        # and regenerate the hashed file) or record a dated
        # exception.
        run: |
          grep -v "nanobot-ai @ git" requirements-hashed.txt > /tmp/requirements-audit.txt
          pip-audit -r /tmp/requirements-audit.txt

      - name: Generate the SBOM (CycloneDX 1.6)
        run: |
          cyclonedx-py requirements requirements-hashed.txt -o sbom.json --of JSON --sv 1.6
          python -c "import json; d=json.load(open('sbom.json')); print(f\"SBOM: {len(d['components'])} components\")"

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Scan the full git history (gitleaks)
        # The 20 Nov 2026 baseline scan (gitleaks 8.28.0, 168
        # commits) found 9 findings, all verified false positives;
        # they are allowlisted by fingerprint in .gitleaks.toml, so
        # any new finding fails this step.
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all"

  lint:
    name: Lint (ruff check)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools only (no torch, fast)
        run: python -m pip install -r requirements-dev.txt

      - name: Run ruff check (rules in pyproject.toml)
        run: ruff check puspa tests demo

  format:
    name: Format check (ruff format)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools only (no torch, fast)
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting (style in pyproject.toml)
        run: ruff format --check puspa tests demo

  typecheck:
    name: Typecheck (mypy)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev dependencies
        # mypy needs the runtime dependencies installed to resolve
        # imports (nanobot, psycopg, fastembed, ...), plus the dev
        # tools themselves. Same install as the test lane, plus the
        # dev file; the torch install makes this lane slow on its
        # first run, like the test lane.
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy (config in pyproject.toml)
        run: python -m mypy puspa tests demo

  # Single aggregate gate: the only check branch protection needs.
  # A skipped lane is fine (nothing changed in its area); only a
  # failure or a cancellation fails the gate.
  all-checks-pass:
    name: All checks pass
    needs: [changes, test, pr-lane, npm-wrapper, sandbox, checks, supply-chain, lint, format, typecheck]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every lane passed
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.test.result }}" "${{ needs.pr-lane.result }}" "${{ needs.npm-wrapper.result }}" "${{ needs.sandbox.result }}" "${{ needs.checks.result }}" "${{ needs.supply-chain.result }}" "${{ needs.lint.result }}" "${{ needs.format.result }}" "${{ needs.typecheck.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "a lane failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "all lanes passed (skipped lanes are fine: nothing changed in their area)"
