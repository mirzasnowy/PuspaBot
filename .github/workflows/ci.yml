# CI (G15) — first workflow for this repo.
#
# Design (hermes-agent orchestrator pattern, in miniature): one workflow,
# per-area lanes, and a single aggregate gate job (`all-checks-pass`) that
# is the only required check for branch protection. The lanes have no
# triggers of their own; everything flows through this workflow.
#
# Lanes:
#   test   — the full suite, SOLO (one pytest process, no parallel
#            runner), against Postgres 16 + pgvector, with
#            infra/schema_core.sql applied first.
#   checks — dependency-light checks that need no database: the
#            file-size ratchet and the docs-drift test, plus a parse
#            check of this workflow file itself.
#
# Lint and typecheck are deliberately NOT here yet: neither ruff nor
# mypy is installed or pinned in this repo (see requirements.txt), and
# a CI step for a tool the repo does not use would fail on its first
# run. Follow-up: pin the tool, then add the step.
#
# Honest limit: this workflow cannot be executed end-to-end on the
# development VM (no Docker, no GitHub runner there). It is correct by
# construction — YAML validated, every referenced command checked —
# and its first real run happens on GitHub.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on a PR branch, but never cancel a run on main
# (a main run that is cancelled leaves the branch state unverified).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Full suite (SOLO)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: puspa-ci-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway password for the ephemeral CI test database only; the
      # database is created fresh per run and destroyed with the runner.
      PUSPA_TEST_DSN: dbname=puspa_test user=root password=puspa-ci-test host=localhost port=5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Set up test database
        env:
          PGPASSWORD: puspa-ci-test
        run: |
          psql "host=localhost user=postgres dbname=postgres" -f infra/schema_core.sql
          # The suite connects as role root over TCP; give that role the
          # same throwaway password as the service superuser. Local runs
          # use peer auth instead and need no password (see
          # docs/verification.md).
          psql "host=localhost user=postgres dbname=postgres" -c "ALTER ROLE root WITH PASSWORD 'puspa-ci-test';"

      - name: Run the full suite (SOLO, no parallel runner)
        run: python -m pytest

  checks:
    name: Ratchet + docs drift (no database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one dependency the drift test needs
        # test_docs_drift.py imports puspa.ledger, which needs psycopg
        # installed but opens no connection. The ratchet test needs only
        # the standard library.
        run: python -m pip install "psycopg[binary]==3.3.9"

      - name: Run the ratchet and drift tests
        run: python -m pytest tests/test_file_size_ratchet.py tests/test_docs_drift.py --noconftest -q

      - name: Check this workflow file parses
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('ci.yml parses')"

  # Single aggregate gate: the only check branch protection needs.
  all-checks-pass:
    name: All checks pass
    needs: [test, checks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every lane passed
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.checks.result }}" = "success"
