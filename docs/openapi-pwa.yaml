  /api/chat:
    post:
      tags: [chat]
      summary: Send a chat message
      description: Appends the message to the group chat and records a user_message event.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Message text
      responses:
        "200":
          description: Message accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
