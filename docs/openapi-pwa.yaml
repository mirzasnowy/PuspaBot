openapi: 3.1.0
info:
  title: PuspaBot PWA API
  version: 1.0.0
  description: |
    Contract for the PuspaBot progressive web app (9 screens: 7 from
    revision 7, plus Insights and Onboarding from the onboarding and cost insights
    maturity work). This spec is the source of truth for the
    TypeScript client in `apps/pwa/src/api/` (types generated
    with openapi-typescript; the thin fetch wrapper in
    `client.ts` is hand-written against those generated types).
    The server implementation is `puspa/pwa/app.py` (FastAPI).
    Form posts use `application/x-www-form-urlencoded`; JSON
    bodies are used only where the server reads `request.json()`
    (push subscription, onboarding time, model settings,
    onboarding steps, hints, autonomy-dial ceiling).
  license:
    name: License pending (Nero's decision)
servers:
  - url: /
    description: Same origin (the FastAPI app serves both pages and API)
tags:
  - name: pages
    description: HTML screens served by the app
  - name: chat
    description: Group chat
  - name: tasks
    description: Tasks and approvals
  - name: agents
    description: Agent management
  - name: connectors
    description: Connector grants per agent
  - name: push
    description: Web Push subscription
  - name: onboarding
    description: Onboarding flow (4 steps) and one-time hints (onboarding and cost insights)
  - name: insights
    description: Cost and token insights from the usage ledger (onboarding and cost insights)
  - name: controls
    description: Stop-all, autonomy dial, and weekly report (stop-all and autonomy dial, plan 12.7)
  - name: live-view
    description: Live view of a bot + human takeover (live bot-screen view and takeover, plan 12.9)
  - name: approval-overlay
    description: Visual approval overlay over the approvals taxonomy gate (visual approval overlay, plan 12.10)
  - name: replay
    description: Replay timeline of a bot's steps + GIF export (replay timeline, plan 12.10)
  - name: chat-cards
    description: Rich cards in Chat (rich cards in chat, plan 12.10)
  - name: chat-widgets
    description: Interactive widgets in Chat (interactive components in chat, plan 12.10)
  - name: office
    description: Office screen and operator panels (PWA serve modes (local operator vs hosted) serve modes)
  - name: settings
    description: Own-model selection (own-model selection in PWA settings)
