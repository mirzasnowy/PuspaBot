  /api/onboarding:
    get:
      tags: [onboarding]
      summary: Read the user's onboarding status
      description: |
        onboarding and cost insights: returns the 4-step onboarding status, or
        `{"started": false, "current_step": 0}` when the user
        never started onboarding.
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/start:
    post:
      tags: [onboarding]
      summary: Start onboarding (idempotent)
      responses:
        "200":
          description: Onboarding status with started true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/step1:
    post:
      tags: [onboarding]
      summary: Complete step 1 (name + speaking style)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, style]
              properties:
                name:
                  type: string
                style:
                  type: string
                  enum: [santai, rapi, campur]
                example_message:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Onboarding status after step 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Onboarding not started, or unknown style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/step2:
    post:
      tags: [onboarding]
      summary: Complete step 2 (notification test)
      description: |
        Honest limit: Web Push is not built yet, so the test is
        recorded as NOT sent (`notification_sent` false) — never
        faked as delivered.
      responses:
        "200":
          description: Onboarding status after step 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Onboarding not started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/step3:
    post:
      tags: [onboarding]
      summary: Complete step 3 (connector choice)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connector:
                  type: string
                  enum: [nanti, gmail, drive, calendar, all]
                  default: nanti
      responses:
        "200":
          description: Onboarding status after step 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          description: Onboarding not started, or unknown connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/first-task:
    post:
      tags: [onboarding]
      summary: Run the guided first task (step 4)
      description: |
        Honest limit: the price-compare / bill wedges are not
        built yet, so the task is a measured stub (`verified`
        false, with a reason); no price or bill result is ever
        invented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, target]
              properties:
                event_type:
                  type: string
                  enum: [compare_prices, check_bill]
                target:
                  type: string
      responses:
        "200":
          description: First-task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstTaskResult"
        "400":
          description: Onboarding not started, or unknown task type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/hints:
    get:
      tags: [onboarding]
      summary: Hints due right now for the reported branch
      description: |
        onboarding and cost insights: the client reports the branch it just reached as
        query params — `screen`, `first_visit`,
        `approval_requested`, `memory_used`, `task_cost_idr`,
        `billing_rows` — and the server returns only the unseen
        hints that branch makes due, in registry order. Only
        branch facts are accepted; no other client data is
        stored.
      parameters:
        - name: screen
          in: query
          schema:
            type: string
        - name: first_visit
          in: query
          schema:
            type: boolean
        - name: approval_requested
          in: query
          schema:
            type: boolean
        - name: memory_used
          in: query
          schema:
            type: boolean
        - name: task_cost_idr
          in: query
          schema:
            type: integer
        - name: billing_rows
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Due hints (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintsResponse"
        "400":
          description: Unparseable integer param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/hints/{flag}/seen:
    post:
      tags: [onboarding]
      summary: Mark one hint seen (shown or dismissed)
      description: |
        Idempotent: marking twice is a no-op. An unknown flag is
        a 400, never a silent no-op.
      parameters:
        - name: flag
          in: path
          required: true
          schema:
            type: string
            enum: [first_modules_visit, first_approval, first_memory_use, first_costly_task, first_billing_row]
      responses:
        "200":
          description: Hint marked seen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintSeenResult"
        "400":
          description: Unknown hint flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/onboarding/waktu:
    post:
      tags: [onboarding]
      summary: Record onboarding time spent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: number
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/operator/status:
    get:
      tags: [office]
      summary: Operator status (serve mode, pairing, gateway, live log)
      description: |
        PWA serve modes (local operator vs hosted): the Office screen polls this endpoint for its operator
        panels. In `local` serve mode the payload carries pairing
        status, gateway status, and the live log lines, all read from
        live server state. In `hosted` mode `operator_panels` is false
        and the panel fields are null: the operator surface of a
        hosted deployment lives in the cloud backend, not here.
        visible embedding degradation: in `local` mode the payload also carries the embedding
        snapshot and its operator banner (null when healthy).
        Requires a logged-in session cookie. Never returns pairing
        codes or session tokens.
      responses:
        "200":
          description: Operator status for the current serve mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorStatus"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin:
    get:
      tags: [admin]
      summary: Local admin dashboard page (Jinja, local mode only)
      description: |
        The operator screen for a self-hosted instance
        (`docs/local-admin-dashboard.md`). Server-rendered Jinja
        (like `/trial`): it works with no React build. Login
        required; in `hosted` serve mode it answers 403, because
        the hosted operator panel lives in the private cloud
        backend, not here.
      responses:
        "200":
          description: Admin page HTML
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Not logged in (redirect to /masuk)
        "403":
          description: Hosted serve mode (no admin surface here)
  /api/admin/config:
    get:
      tags: [admin]
      summary: Instance configuration (local mode only)
      description: |
        Instance name (editable), serve mode (read-only: changing
        it needs PUSPA_SERVE_MODE plus a restart), the model
        selection, the telemetry switch, and the embedding
        snapshot. Requires a logged-in session cookie; 403 in
        `hosted` serve mode.
      responses:
        "200":
          description: Instance configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfig"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [admin]
      summary: Save instance configuration (local mode only)
      description: |
        Any of `instance_name`, `model`, `telemetry_enabled`.
        Each part is validated and stored by its owning module;
        a bad value is a 400 naming the problem, and an unknown
        key is a 400, never silently ignored. Returns the saved
        configuration in the GET shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConfigUpdate"
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfig"
        "400":
          description: Bad value, unknown key, or empty body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/sessions:
    get:
      tags: [admin]
      summary: Operator sessions (local mode only)
      description: |
        The operator's login sessions (device label, created /
        last-seen times, revoked flag), the live pairing-store
        snapshot, and the active/revoked counts. Tokens are never
        exposed: only their hashes are stored, and this listing
        does not even carry those. Requires a logged-in session
        cookie; 403 in `hosted` serve mode.
      responses:
        "200":
          description: Sessions plus pairing snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessions"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/sessions/{session_id}/revoke:
    post:
      tags: [admin]
      summary: Revoke one session by id (local mode only)
      description: |
        Revokes one login session of the operator by its row id.
        Idempotent. An unknown id and another user's id both
        answer 404, so one user's ids cannot probe another's.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, session_id, revoked]
                properties:
                  ok:
                    type: boolean
                  session_id:
                    type: string
                  revoked:
                    type: boolean
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such session for this operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/sessions/revoke-all:
    post:
      tags: [admin]
      summary: Revoke all operator sessions (local mode only)
      description: |
        Revokes every session of the operator, including the
        browser making the call: the operator signs themselves
        out everywhere.
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked_all]
                properties:
                  ok:
                    type: boolean
                  revoked_all:
                    type: boolean
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/usage:
    get:
      tags: [admin]
      summary: Usage statistics from the ledger (local mode only)
      description: |
        Counts from data the instance already keeps: the
        append-only ledger (`events`), the account tables, the
        hub skill list, and the in-memory chat store. No new
        telemetry is collected. Requires a logged-in session
        cookie; 403 in `hosted` serve mode.
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsage"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/skills:
    get:
      tags: [admin]
      summary: Installed skills (local mode only)
      description: |
        The same skill list the hub serves: shipped builtins
        plus registry skills. Requires a logged-in session
        cookie; 403 in `hosted` serve mode.
      responses:
        "200":
          description: Installed skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSkills"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/skills/{skill_id}/enable:
    post:
      tags: [admin]
      summary: Enable an installed library skill (local mode only)
      description: |
        Enables a skill through the existing skill registry
        (`MarketplaceRegistry.install`); the operator's POST is
        the explicit approval, mirroring the hub install.
        Builtin skills ship with Puspa and are always on:
        toggling one is a 409 with that reason.
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSkillToggleResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Builtin skill (always on, cannot be toggled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/skills/{skill_id}/disable:
    post:
      tags: [admin]
      summary: Disable an installed library skill (local mode only)
      description: |
        Disables a skill through the existing skill registry
        (`MarketplaceRegistry.uninstall`). Builtin skills ship
        with Puspa and are always on: toggling one is a 409
        with that reason.
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSkillToggleResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Hosted serve mode (no admin surface here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Builtin skill (always on, cannot be toggled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/model-settings:
    get:
      tags: [settings]
      summary: Read the user's own-model selection
      description: |
        Returns the stored selection (hosted / BYOK / local). Never
        returns key material: only `has_byok_key` (boolean) says
        whether a BYOK key exists in the vault.
      responses:
        "200":
          description: Stored selection (hosted when never set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSettings"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [settings]
      summary: Save the user's own-model selection
      description: |
        Persists the choice only; a key must never be sent here —
        any key field in the body is refused with 400. A BYOK key
        is saved through POST /api/model-settings/byok-key, which
        stores it in the vault only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSettings"
      responses:
        "200":
          description: Saved selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSettings"
        "400":
          description: Invalid selection (unknown source, bad base URL, key field present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/model-settings/byok-key:
    post:
      tags: [settings]
      summary: Save a BYOK key into the vault
      description: |
        The key is stored only in the existing per-user vault
        (entry `byok:<provider>`, envelope-encrypted) and is
        never returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, key]
              properties:
                provider:
                  type: string
                  example: openrouter
                key:
                  type: string
                  description: The provider API key; stored in the vault only.
      responses:
        "200":
          description: Key stored in the vault
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Empty provider or key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [settings]
      summary: Delete a BYOK key from the vault
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key deleted (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/model-settings/pool-quota:
    get:
      tags: [settings]
      summary: Read the provider pool's quota bars for Settings (V2-40)
      description: |
        One entry per account the user holds for `provider` (BYOK
        keys in the vault, OAuth subscription login): used fraction
        and remaining tokens per 5h / weekly window, the reset
        countdown, and availability — the gsb /ui quota-bar pattern.
        Never returns key material: only usage figures and labels.
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
          example: openrouter
      responses:
        "200":
          description: Quota bars (empty accounts when no credential exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolQuotaResponse"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/providers:
    get:
      tags: [settings]
      summary: List subscription providers with login state (V2-28, V2-29)
      description: |
        One entry per known subscription provider (23 providers: the
        V2-28 three plus the 9Router list) with its login state.
        Never returns token material: only the state and the expiry
        time.
      responses:
        "200":
          description: Provider login states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/providers/{provider}/login/start:
    post:
      tags: [settings]
      summary: Start a subscription login (V2-28, V2-29)
      description: |
        PKCE providers return an authorize URL to open in a tab;
        device-flow providers return a user code and verification URL;
        polling providers (GLM, CodeBuddy) return a sign-in URL and a
        poll key; pasted-token providers (Claude setup token, Cursor
        import) and the encoded-token provider (Cline) return the help
        text for what to paste. The pending login lives server-side
        in memory for ten minutes.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [antigravity, claude, cline, codebuddy_cn, codebuddy_intl, cursor, gemini_cli, github_copilot, gitlab, glm, grok_cli, iflow, kilocode, kimi, kiro, minimax_code, minimax_code_global, muse, nous, openai_codex, qoder, qoder_cn, xai]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  description: PKCE redirect URI (defaults to the PWA callback).
      responses:
        "200":
          description: Login started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderLoginStart"
        "400":
          description: Provider login is not wired yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/providers/{provider}/login/finish-token:
    post:
      tags: [settings]
      summary: Finish a pasted-token subscription login (V2-29)
      description: |
        Finishes a pasted-token login (Claude setup token, Cursor
        import) or an encoded-token login (Cline base64 blob):
        checks the pasted token, stores it in the vault, and
        returns the provider status. The token value is never in
        the response.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [antigravity, claude, cline, codebuddy_cn, codebuddy_intl, cursor, gemini_cli, github_copilot, gitlab, glm, grok_cli, iflow, kilocode, kimi, kiro, minimax_code, minimax_code_global, muse, nous, openai_codex, qoder, qoder_cn, xai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Pasted setup token, imported token, or base64 token blob.
      responses:
        "200":
          description: Provider status after login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "400":
          description: No token pasted, or the pasted token has the wrong shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/providers/callback:
    get:
      tags: [settings]
      summary: Finish a PKCE subscription login (V2-28)
      description: |
        The provider redirects here with `code` and `state`; the code is
        exchanged for tokens stored in the vault, and a plain page says
        the login is done. No token is ever in the response.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Login done (HTML page)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown or stale login session
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/providers/{provider}/device/poll:
    post:
      tags: [settings]
      summary: Poll a device-flow or polling subscription login (V2-28, V2-29)
      description: |
        Serves the device flow and the polling flow (GLM, CodeBuddy)
        alike: `pending` while the user has not approved yet,
        `complete` with the provider status once stored.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [antigravity, claude, cline, codebuddy_cn, codebuddy_intl, cursor, gemini_cli, github_copilot, gitlab, glm, grok_cli, iflow, kilocode, kimi, kiro, minimax_code, minimax_code_global, muse, nous, openai_codex, qoder, qoder_cn, xai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poll_key]
              properties:
                poll_key:
                  type: string
                  description: Poll key returned by the login start.
      responses:
        "200":
          description: "`pending` while the user has not approved yet, `complete` with the provider status once stored"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, complete]
                  provider:
                    type: string
                  state:
                    type: string
                    enum: [logged_in, expiring, expired, not_logged_in]
        "400":
          description: Unknown device login, or the flow expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/providers/{provider}/logout:
    post:
      tags: [settings]
      summary: Log out of a subscription provider (V2-28)
      description: Deletes the provider's tokens from the vault (idempotent).
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [antigravity, claude, cline, codebuddy_cn, codebuddy_intl, cursor, gemini_cli, github_copilot, gitlab, glm, grok_cli, iflow, kilocode, kimi, kiro, minimax_code, minimax_code_global, muse, nous, openai_codex, qoder, qoder_cn, xai]
      responses:
        "200":
          description: Provider status after logout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
