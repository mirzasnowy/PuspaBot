    PreparedPayment:
      $ref: './openapi-payments.yaml#/components/schemas/PreparedPayment'
    PreparedPaymentList:
      $ref: './openapi-payments.yaml#/components/schemas/PreparedPaymentList'
    ModelSettings:
      type: object
      description: |
        The user's own-model selection (own-model selection in PWA settings). Carries no key
        material: `has_byok_key` only says whether a BYOK key
        exists in the vault.
      required: [source, has_byok_key]
      properties:
        source:
          type: string
          enum: [hosted, byok, local]
          description: hosted = PuspaBot default; byok = own API key from the vault; local = local OpenAI-compatible model (Ollama).
        base_url:
          type: string
          nullable: true
          description: Local model base URL, or a BYOK provider override. Must be a valid http(s) URL.
          example: http://localhost:11434/v1
        model:
          type: string
          nullable: true
          description: Model id to ask for (local default `llama3.1`).
        provider:
          type: string
          nullable: true
          description: BYOK provider name; its key lives in the vault under `byok:<provider>`.
          example: openrouter
        has_byok_key:
          type: boolean
          description: Whether a BYOK key for `provider` exists in the vault.
    PoolQuotaWindow:
      type: object
      description: |
        One quota window of one pool account (V2-40). `used_fraction`
        is null when the window has no registered limit (untracked:
        the account is usable, its usage is just not measured yet).
      required: [window, limit_tokens, tokens_used, tokens_remaining, used_fraction, reset_in_seconds, exhausted]
      properties:
        window:
          type: string
          enum: ["5h", weekly]
        limit_tokens:
          type: integer
          nullable: true
        tokens_used:
          type: integer
          nullable: true
        tokens_remaining:
          type: integer
          nullable: true
        used_fraction:
          type: number
          nullable: true
        reset_in_seconds:
          type: integer
          nullable: true
        exhausted:
          type: boolean
    PoolQuotaAccount:
      type: object
      description: |
        One pool account's quota bar (V2-40). Carries no credential
        material: only the label, availability, and usage figures.
      required: [account_id, provider, kind, label, disabled, available, skip_reason, rate_limited, cooling_until_in_seconds, fails, strikes, last_used, requests_last_minute, max_rpm, max_concurrent, active_streams, windows]
      properties:
        account_id:
          type: string
          example: openrouter:1
        provider:
          type: string
          example: openrouter
        kind:
          type: string
          enum: [byok, oauth]
        label:
          type: string
          example: openrouter key 1
        disabled:
          type: boolean
        available:
          type: boolean
        skip_reason:
          type: string
          nullable: true
          description: Why the account cannot serve now (disabled, cooling, quota_exhausted, rate_limited), null when ready.
        rate_limited:
          type: boolean
        cooling_until_in_seconds:
          type: integer
        fails:
          type: integer
        strikes:
          type: integer
        last_used:
          type: string
          nullable: true
        requests_last_minute:
          type: integer
        max_rpm:
          type: integer
        max_concurrent:
          type: integer
        active_streams:
          type: integer
        windows:
          type: array
          items:
            $ref: "#/components/schemas/PoolQuotaWindow"
    PoolQuotaResponse:
      type: object
      description: Quota bars for one provider's pool (V2-40).
      required: [provider, strategy, accounts]
      properties:
        provider:
          type: string
          example: openrouter
        strategy:
          type: string
          enum: [rotate, lru, fill-first]
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/PoolQuotaAccount"
    ProviderStatus:
      type: object
      description: |
        Login state of one subscription provider (V2-28, V2-29).
        Carries no token material: only the state and the expiry
        time.
      required: [provider, flow, state, expires_at, login_ready]
      properties:
        provider:
          type: string
          enum: [antigravity, claude, cline, codebuddy_cn, codebuddy_intl, cursor, gemini_cli, github_copilot, gitlab, glm, grok_cli, iflow, kilocode, kimi, kiro, minimax_code, minimax_code_global, muse, nous, openai_codex, qoder, qoder_cn, xai]
        flow:
          type: string
          enum: [pkce, device, polling, setup_token, import_token, encoded_token]
        state:
          type: string
          enum: [logged_in, expiring, expired, not_logged_in]
        expires_at:
          type: string
          nullable: true
          description: ISO-8601 expiry of the access token, or null when not logged in.
        login_ready:
          type: boolean
          description: False when the provider login is not wired yet (for example a PKCE provider whose client secret env var is missing).
        local_only:
          type: boolean
          description: True for every plan-credential provider. On a hosted deployment the login is refused.
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
    ProviderLoginStart:
      type: object
      description: |
        What the user needs to finish a login (V2-28, V2-29): an
        authorize URL for PKCE, a user code + verification URL for
        the device flow, a sign-in URL for the polling flow, or
        help text for a pasted-token login.
      required: [flow]
      properties:
        flow:
          type: string
          enum: [pkce, device, polling, setup_token, import_token, encoded_token]
        url:
          type: string
          description: PKCE authorize URL to open in a tab.
        state:
          type: string
          description: PKCE login state, returned to the callback.
        user_code:
          type: string
          description: Device-flow code the user types at the verification URL.
        verification_uri:
          type: string
          description: Device-flow URL the user opens to approve.
        expires_in:
          type: integer
          description: Seconds until the device code expires.
        interval:
          type: integer
          description: Seconds to wait between device polls.
        poll_key:
          type: string
          description: Key to pass back when polling the device login.
        help:
          type: string
          description: Pasted-token login help text (where the token comes from).
        token_prefix:
          type: string
          nullable: true
          description: Expected prefix of a pasted setup token (Claude `sk-ant-oat01-`), or null.
    InsightsReport:
      type: object
      description: |
        onboarding and cost insights: cost and token totals from the usage ledger over the
        last N calendar days ending today. Costs are exact integer
        Rupiah plus server-rendered labels; the per-1k-token rate
        is null (not zero) when no tokens were recorded.
      required: [window_days, since, until, turns, tokens, cost, per_model, per_driver, tool_usage, module_usage, activity_per_day, top_costly_tasks, tool_errors, task_cost_ceiling_idr]
      properties:
        window_days:
          type: integer
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        turns:
          type: integer
        tokens:
          $ref: "#/components/schemas/TokenTotals"
        cost:
          $ref: "#/components/schemas/CostSummary"
        per_model:
          type: array
          items:
            $ref: "#/components/schemas/ModelBreakdown"
        per_driver:
          type: array
          items:
            $ref: "#/components/schemas/DriverBreakdown"
        tool_usage:
          type: array
          items:
            $ref: "#/components/schemas/ToolUsage"
        module_usage:
          type: array
          items:
            $ref: "#/components/schemas/ModuleUsage"
        activity_per_day:
          type: array
          items:
            $ref: "#/components/schemas/DayActivity"
        top_costly_tasks:
          type: array
          items:
            $ref: "#/components/schemas/CostlyTask"
        tool_errors:
          type: integer
        task_cost_ceiling_idr:
          type: integer
    TokenTotals:
      type: object
      required: [input, output, cached, total]
      properties:
        input:
          type: integer
        output:
          type: integer
        cached:
          type: integer
        total:
          type: integer
    CostSummary:
      type: object
      required: [total_idr, label, avg_per_turn_idr, avg_per_turn_label, per_1k_tokens_idr, per_1k_tokens_label]
      properties:
        total_idr:
          type: integer
        label:
          type: string
          example: Rp1.500
        avg_per_turn_idr:
          type: number
        avg_per_turn_label:
          type: string
        per_1k_tokens_idr:
          type: number
          nullable: true
        per_1k_tokens_label:
          type: string
          nullable: true
          description: Four-decimal rate label, or null when no tokens were recorded.
    ModelBreakdown:
      type: object
      required: [model, turns, tokens, cost_idr, share]
      properties:
        model:
          type: string
        turns:
          type: integer
        tokens:
          type: integer
        cost_idr:
          type: integer
        share:
          type: number
    DriverBreakdown:
      type: object
      required: [driver, turns, tokens, cost_idr, share]
      properties:
        driver:
          type: string
        turns:
          type: integer
        tokens:
          type: integer
        cost_idr:
          type: integer
        share:
          type: number
    ToolUsage:
      type: object
      required: [tool, uses]
      properties:
        tool:
          type: string
        uses:
          type: integer
    ModuleUsage:
      type: object
      required: [module_id, turns, cost_idr]
      properties:
        module_id:
          type: string
        turns:
          type: integer
        cost_idr:
          type: integer
    DayActivity:
      type: object
      required: [date, turns, tokens, cost_idr]
      properties:
        date:
          type: string
          format: date
        turns:
          type: integer
        tokens:
          type: integer
        cost_idr:
          type: integer
    CostlyTask:
      type: object
      required: [task_id, turns, tokens, cost_idr]
      properties:
        task_id:
          type: string
        turns:
          type: integer
        tokens:
          type: integer
        cost_idr:
          type: integer
    OnboardingStatus:
      type: object
      description: |
        onboarding and cost insights: the 4-step first-run onboarding status. Before start
        the server returns only `started: false` and
        `current_step: 0`.
      required: [started, current_step]
      properties:
        started:
          type: boolean
        current_step:
          type: integer
          description: Steps completed so far (0..4)
        user_id:
          type: string
        name:
          type: string
          nullable: true
        style:
          type: string
          nullable: true
          enum: [santai, rapi, campur]
        test_notification:
          type: string
          nullable: true
        connector:
          type: string
          nullable: true
        first_task:
          type: string
          nullable: true
        first_result_verified:
          type: boolean
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          nullable: true
        style_fact_id:
          type: string
          description: Id of the saved style fact (step 1 response only).
        notification_sent:
          type: boolean
          description: Whether the step 2 test notification was sent (step 2 response only; false until Web Push exists).
    FirstTaskResult:
      type: object
      description: |
        onboarding and cost insights: the guided first task (step 4). Always `verified:
        false` for now: the price-compare / bill wedges are not
        built yet, so the task is a measured stub.
      required: [status, task_id, type, target, verified, reason, task_duration_seconds, event_ids, offered_workflow_templates]
      properties:
        status:
          $ref: "#/components/schemas/OnboardingStatus"
        task_id:
          type: string
        type:
          type: string
          enum: [compare_prices, check_bill]
        target:
          type: string
        verified:
          type: boolean
        reason:
          type: string
        task_duration_seconds:
          type: number
        event_ids:
          type: array
          items:
            type: string
        offered_workflow_templates:
          type: array
          items:
            type: string
    Hint:
      type: object
      description: |
        onboarding and cost insights: one contextual, one-time hint. Plain text plus the
        target screen name; never a secret, never an action.
      required: [flag, trigger, title, body, screen, action_label]
      properties:
        flag:
          type: string
          enum: [first_modules_visit, first_approval, first_memory_use, first_costly_task, first_billing_row]
        trigger:
          type: string
        title:
          type: string
        body:
          type: string
        screen:
          type: string
        action_label:
          type: string
    HintsResponse:
      type: object
      required: [hints]
      properties:
        hints:
          type: array
          items:
            $ref: "#/components/schemas/Hint"
    HintSeenResult:
      type: object
      required: [user_id, flag, seen]
      properties:
        user_id:
          type: string
        flag:
          type: string
        seen:
          type: boolean
    ChatMessage:
      type: object
      required: [sender, text, created_at]
      properties:
        sender:
          type: string
          description: Sender id ("users" for the user in the demo store)
        text:
          type: string
        created_at:
          type: number
          description: Unix timestamp (seconds)
        card:
          $ref: './openapi-chat-cards.yaml#/components/schemas/ChatCard'
          description: Optional rich card (rich cards in chat) shown inside the chat message
        widget:
          $ref: './openapi-chat-widgets.yaml#/components/schemas/ChatWidget'
          description: Optional interactive widget (interactive components in chat) shown inside the chat message
        attachments:
          type: array
          description: Attachments on the message (COW-19); empty when the message is text only
          items:
            $ref: "#/components/schemas/ChatAttachment"
    ChatAttachment:
      type: object
      required: [id, kind, mime_type, size_bytes, download_url]
      properties:
        id:
          type: string
        kind:
          type: string
          description: image, audio, or file
        mime_type:
          type: string
        size_bytes:
          type: integer
        filename:
          type: string
        transcript:
          type: string
          description: Voice-note transcript, when the attachment is a transcribed recording
        url:
          type: string
          description: Provider URL, only for a provider-hosted (generated) image
        download_url:
          type: string
          description: GET this URL to download the attachment (owner only)
    Agent:
      type: object
      required: [agent_id, name]
      properties:
        agent_id:
          type: string
        name:
          type: string
        role:
          type: string
        purpose:
          type: string
        required:
          type: boolean
          description: True for the mandatory PuspaBot agent
    TaskOutcome:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          type: string
        stage:
          type: string
        question:
          type: string
          nullable: true
    StopResult:
      type: object
      properties:
        stopped:
          type: integer
          description: Number of sub-agents stopped (0 when none were active)
        revoked_tokens:
          type: array
          items:
            type: string
        seconds:
          type: number
    StopAllAgentEntry:
      $ref: './openapi-controls.yaml#/components/schemas/StopAllAgentEntry'
    StopAllReport:
      $ref: './openapi-controls.yaml#/components/schemas/StopAllReport'
    DialSuggestion:
      $ref: './openapi-controls.yaml#/components/schemas/DialSuggestion'
    DialAreaState:
      $ref: './openapi-controls.yaml#/components/schemas/DialAreaState'
    DialState:
      $ref: './openapi-controls.yaml#/components/schemas/DialState'
    CeilingRequest:
      $ref: './openapi-controls.yaml#/components/schemas/CeilingRequest'
    WeeklyLinkedEvent:
      $ref: './openapi-controls.yaml#/components/schemas/WeeklyLinkedEvent'
    WeeklyReport:
      $ref: './openapi-controls.yaml#/components/schemas/WeeklyReport'
    ComputerAllowlist:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerAllowlist'
    ComputerAllowlistRequest:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerAllowlistRequest'
    ComputerAllowlistChange:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerAllowlistChange'
    ComputerStopState:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerStopState'
    ComputerStopRequest:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerStopRequest'
    ComputerAuditEntry:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerAuditEntry'
    ComputerAuditList:
      $ref: './openapi-computer.yaml#/components/schemas/ComputerAuditList'
    TakeoverHold:
      $ref: './openapi-live-view.yaml#/components/schemas/TakeoverHold'
    LiveFrameEvent:
      $ref: './openapi-live-view.yaml#/components/schemas/LiveFrameEvent'
    LiveFrameTool:
      $ref: './openapi-live-view.yaml#/components/schemas/LiveFrameTool'
    LiveFrame:
      $ref: './openapi-live-view.yaml#/components/schemas/LiveFrame'
    TakeoverRequest:
      $ref: './openapi-live-view.yaml#/components/schemas/TakeoverRequest'
    TakeoverReport:
      $ref: './openapi-live-view.yaml#/components/schemas/TakeoverReport'
    TakeoverReleaseReport:
      $ref: './openapi-live-view.yaml#/components/schemas/TakeoverReleaseReport'
    ApprovalCardLine:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/ApprovalCardLine'
    TargetElement:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/TargetElement'
    ApprovalOverlayCard:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/ApprovalOverlayCard'
    OverlayHighlight:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/OverlayHighlight'
    ApprovalOverlay:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/ApprovalOverlay'
    ApprovalOverlayList:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/ApprovalOverlayList'
    ChatCard:
      $ref: './openapi-chat-cards.yaml#/components/schemas/ChatCard'
    ChatWidget:
      $ref: './openapi-chat-widgets.yaml#/components/schemas/ChatWidget'
    ProposeOverlayRequest:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/ProposeOverlayRequest'
    OverlayDecisionRequest:
      $ref: './openapi-approval-overlay.yaml#/components/schemas/OverlayDecisionRequest'
    ReplayTaskSummary:
      $ref: './openapi-replay.yaml#/components/schemas/ReplayTaskSummary'
    ReplayStep:
      $ref: './openapi-replay.yaml#/components/schemas/ReplayStep'
    ReplayTimeline:
      $ref: './openapi-replay.yaml#/components/schemas/ReplayTimeline'
    ArtifactSummary:
      $ref: './openapi-artifacts.yaml#/components/schemas/ArtifactSummary'
    ApprovalRequest:
      type: object
      required: [request_id, status]
      properties:
        request_id:
          type: string
        kind:
          type: string
          description: Action kind, e.g. spend, send, share
        task_id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        summary:
          type: string
          description: Full human-readable content of what is being approved
        amount_rp:
          type: integer
          nullable: true
        target:
          type: string
          description: Where the action goes (recipient, merchant, account)
        content_hash:
          type: string
          description: Hash binding the approval to the exact content
    ConnectorResult:
      type: object
      properties:
        ok:
          type: boolean
        connected:
          type: boolean
        agent_id:
          type: string
        connector:
          type: string
        scope:
          type: string
    OfficeProjection:
      type: object
      properties:
        agent:
          type: object
          description: Live agent status keyed by agent id
          additionalProperties:
            $ref: "#/components/schemas/OfficeAgent"
        agents:
          type: array
          description: Live agent status as a list, the shape the server actually sends from puspa.evidence.projections.office; the same data as the keyed agent map. Clients must accept both shapes.
          items:
            $ref: "#/components/schemas/OfficeAgent"
    OfficeAgent:
      type: object
      properties:
        agent_id:
          type: string
        status:
          type: string
          enum: [idle, working]
        last_task:
          type: string
        cost_rp:
          type: integer
        subagents:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              permission_class:
                type: string
                enum: [reader, executor, checker]
    ProfileFact:
      type: object
      description: One sourced profile fact (puspa.memory.profile)
      properties:
        key:
          type: string
        value:
          type: string
        origin:
          type: string
          enum: [user_stated, user_confirmed, inferred]
        status:
          type: string
          enum: [proposal, active, rejected, replaced]
    SseEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [office, heartbeat, room_activity]
        content:
          $ref: "#/components/schemas/OfficeProjection"
        room_activity:
          $ref: "#/components/schemas/RoomActivity"
        created_at:
          type: number
    RoomActivity:
      $ref: './openapi-rooms.yaml#/components/schemas/RoomActivity'
    Manifest:
      type: object
      required: [name, short_name, start_url, display]
      properties:
        name:
          type: string
        short_name:
          type: string
        start_url:
          type: string
        display:
          type: string
        background_color:
          type: string
        theme_color:
          type: string
        icons:
          type: array
          items:
            type: object
            properties:
              src:
                type: string
              sizes:
                type: string
              type:
                type: string
        share_target:
          type: object
          description: |
            PWA share target and voice messages: Web Share Target — the installed PWA appears in
            Android's share menu; shares land on POST /share.
          properties:
            action:
              type: string
            method:
              type: string
            enctype:
              type: string
            params:
              type: object
    Bootstrap:
      type: object
      description: |
        Server-rendered seed embedded in every screen's HTML as
        `window.__PUSPA_BOOTSTRAP__` (JSON). The SPA hydrates its
        per-screen stores from it, so the first paint already has
        real data and no extra fetch is needed.
      properties:
        screen:
          type: string
          enum: [chat, tasks, modules, connectors, memory, settings, office, live, replay, artifacts, insights, onboarding, login]
        user_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequest"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        profile:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFact"
        office:
          $ref: "#/components/schemas/OfficeProjection"
        handoffs:
          type: array
          items:
            type: object
        shared_text:
          type: string
          description: |
            PWA share target and voice messages: text shared into the PWA from another app (GET/POST
            /share). The Chat screen prefills its draft with it;
            absent on every other screen.
    OperatorStatus:
      type: object
      description: |
        PWA serve modes (local operator vs hosted): the `GET /api/operator/status` payload. In `local` serve
        mode `pairing`, `gateway`, and `log` are read from live server
        state; in `hosted` mode `operator_panels` is false and the
        panel fields are null. Pairing codes and session tokens are
        never included.
        visible embedding degradation: in `local` mode the payload also carries the embedding
        snapshot (`embedding`) and its operator banner
        (`embedding_banner`, null when healthy), so a degraded
        embedding is visible on the operator surface.
      required: [mode, operator_panels]
      properties:
        mode:
          type: string
          enum: [local, hosted]
        operator_panels:
          type: boolean
          description: True only in local mode; the client shows the operator panels on this flag alone
        pairing:
          $ref: "#/components/schemas/PairingStatus"
        gateway:
          $ref: "#/components/schemas/GatewayStatus"
        log:
          type: array
          items:
            $ref: "#/components/schemas/OperatorLogLine"
        embedding:
          $ref: "#/components/schemas/EmbeddingHealth"
        embedding_banner:
          $ref: "#/components/schemas/EmbeddingBanner"
    AdminConfig:
      type: object
      description: |
        The `GET /api/admin/config` payload: the instance
        configuration the local admin dashboard shows and edits.
        `serve_mode` is read-only here (changing it needs
        PUSPA_SERVE_MODE plus a restart).
      required: [instance_name, serve_mode, serve_mode_change, model, telemetry]
      properties:
        instance_name:
          type: string
          description: Display name of this instance (default "Puspa")
        serve_mode:
          type: string
          enum: [local, hosted]
        serve_mode_change:
          type: string
          description: How the serve mode is actually changed
        model:
          type: object
          description: The stored model selection (see model-settings)
        telemetry:
          type: object
          description: Stored toggle, env override, effective switch
          properties:
            enabled:
              type: boolean
            env_override:
              type: boolean
              nullable: true
            effective_enabled:
              type: boolean
        embedding:
          $ref: "#/components/schemas/EmbeddingHealth"
    AdminConfigUpdate:
      type: object
      description: |
        The `POST /api/admin/config` body. Any of the three keys;
        at least one is required, and an unknown key is a 400.
      properties:
        instance_name:
          type: string
          maxLength: 80
        model:
          type: object
          description: Model selection (source, base_url, model, provider; never a key)
        telemetry_enabled:
          type: boolean
    AdminSession:
      type: object
      description: One login session (no token material of any kind).
      required: [id, device_label, created_at, last_seen_at, revoked]
      properties:
        id:
          type: string
          format: uuid
        device_label:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
    AdminSessions:
      type: object
      description: The `GET /api/admin/sessions` payload.
      required: [sessions, active, revoked, pairing]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AdminSession"
        active:
          type: integer
        revoked:
          type: integer
        pairing:
          $ref: "#/components/schemas/PairingStatus"
    AdminUsage:
      type: object
      description: |
        The `GET /api/admin/usage` payload: counts from the ledger
        and the live stores, no new telemetry. `messages_in_memory`
        counts chat messages held this run only (the in-memory chat
        store resets on restart).
      required: [events_total, events_by_type, events_last_24h, events_last_7d, users, sessions_active, skills, messages_in_memory]
      properties:
        events_total:
          type: integer
        events_by_type:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type:
                type: string
              count:
                type: integer
        events_last_24h:
          type: integer
        events_last_7d:
          type: integer
        users:
          type: integer
        sessions_active:
          type: integer
        skills:
          type: object
          required: [total, installed, builtin, library]
          properties:
            total:
              type: integer
            installed:
              type: integer
            builtin:
              type: integer
            library:
              type: integer
        messages_in_memory:
          type: integer
    AdminSkills:
      type: object
      description: The `GET /api/admin/skills` payload (the hub skill list).
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "./openapi-hub.yaml#/components/schemas/HubSkill"
    AdminSkillToggleResult:
      type: object
      description: The enable/disable POST result for one skill.
      required: [ok, skill_id, status]
      properties:
        ok:
          type: boolean
        skill_id:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        installed:
          type: object
          description: The registry install record for this skill
    EmbeddingHealth:
      type: object
      description: |
        visible embedding degradation: one snapshot of embedding health, built at startup. `status`
        is `degraded` in production when only the hash stand-in is
        available (or when a hash fallback happened); `alarm` is true
        when a production fallback was seen or canary recall fell more
        than 10 percent below its baseline.
      properties:
        embedder_id:
          type: string
        dimension:
          type: integer
        status:
          type: string
          enum: [healthy, degraded]
        reason:
          type: string
        fallback_count:
          type: integer
        environment:
          type: string
        alarm:
          type: boolean
        alarm_reasons:
          type: array
          items:
            type: string
        canary:
          type: object
          nullable: true
    EmbeddingBanner:
      type: object
      description: visible embedding degradation operator banner for a degraded embedding; null when healthy.
      properties:
        level:
          type: string
          enum: [warning]
        title:
          type: string
        detail:
          type: string
    HealthStatus:
      type: object
      description: visible embedding degradation `GET /health` payload. Always 200 while the server is up; `status` carries ok / degraded.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        serve_mode:
          type: string
          enum: [local, hosted]
        embedding:
          $ref: "#/components/schemas/EmbeddingHealth"
    PairingStatus:
      type: object
      description: Live pairing-store snapshot (PWA serve modes (local operator vs hosted)). No codes or tokens, only counts and session metadata.
      properties:
        active_codes:
          type: integer
        active_sessions:
          type: integer
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PairingSession"
        locked_addresses:
          type: integer
        locks:
          type: array
          items:
            $ref: "#/components/schemas/PairingLock"
    PairingSession:
      type: object
      properties:
        user_id:
          type: string
        device_label:
          type: string
        expires_at:
          type: number
    PairingLock:
      type: object
      properties:
        address:
          type: string
        failures:
          type: integer
        locked_until:
          type: number
    GatewayStatus:
      type: object
      description: Live action-gateway state (PWA serve modes (local operator vs hosted)). `last_decision` is null until the gateway decides its first action.
      properties:
        policy:
          $ref: "#/components/schemas/GatewayPolicy"
        dry_run:
          type: boolean
        decisions:
          type: integer
        last_decision:
          $ref: "#/components/schemas/GatewayDecision"
    GatewayPolicy:
      type: object
      properties:
        loaded:
          type: boolean
        stale:
          type: boolean
          description: True when the snapshot went stale; a stale or never-loaded snapshot refuses everything (fail-closed)
        dry_run:
          type: boolean
        deny_rules:
          type: array
          items:
            type: string
        allow_rules:
          type: array
          items:
            type: string
    GatewayDecision:
      type: object
      properties:
        allowed:
          type: boolean
        outcome:
          type: string
          enum: [allow, deny]
        rule:
          type: string
          nullable: true
        reason:
          type: string
        dry_run:
          type: boolean
        forwarded:
          type: boolean
        tool:
          type: string
        actor:
          type: string
        page_host:
          type: string
        recorded_at:
          type: number
    OperatorLogLine:
      type: object
      description: One live log line from the app event log (PWA serve modes (local operator vs hosted)).
      properties:
        type:
          type: string
        created_at:
          type: number
        summary:
          type: string
