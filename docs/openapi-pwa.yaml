  /api/agen:
    post:
      tags: [agents]
      summary: Create an agent
      description: Max 3 agents per user (PuspaBot + 2 user agents).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                role:
                  type: string
                purpose:
                  type: string
      responses:
        "200":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Invalid name or agent limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agen/{agent_id}:
    delete:
      tags: [agents]
      summary: Delete an agent
      description: The mandatory PuspaBot agent cannot be deleted (400).
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: PuspaBot agent or unknown agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tugas:
    post:
      tags: [tasks]
      summary: Create and run a task
      description: Runs synchronously through the TaskRunner and returns the outcome.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  description: What the task should do
      responses:
        "200":
          description: Task outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskOutcome"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tugas/{task_id}/hentikan:
    post:
      tags: [tasks]
      summary: Stop a task
      description: Stops all sub-agents of the task and revokes their tokens (target under 5s).
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/persetujuan/{request_id}:
    post:
      tags: [tasks]
      summary: Decide an approval request (one tap)
      description: |
        Content-bound approval: if the approved content changes
        afterwards, the approval is void and asked again.
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: string
                  enum: ["ya", "tidak"]
                  description: 'Value "ya" approves, anything else rejects'
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [approved, rejected]
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/konektor/{konektor}:
    post:
      tags: [connectors]
      summary: Grant or revoke a connector for an agent
      parameters:
        - name: konektor
          in: path
          required: true
          schema:
            type: string
            enum: [gmail, drive, calendar]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [agent_id, action]
              properties:
                agent_id:
                  type: string
                action:
                  type: string
                  description: '"cabut" revokes; any other value grants'
      responses:
        "200":
          description: Grant or revoke result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorResult"
        "400":
          description: Unknown connector or agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/push/langganan:
    post:
      tags: [push]
      summary: Save a Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  format: uri
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, subscription_id]
                properties:
                  ok:
                    type: boolean
                  subscription_id:
                    type: string
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/insights:
    get:
      tags: [insights]
      summary: Cost and token insights report for the logged-in user
      description: |
        onboarding and cost insights: summarises the usage ledger over the last N calendar
        days ending today (default 7, allowed 1..90). All costs
        are exact integer Rupiah plus server-rendered labels; the
        client never re-derives a cost. A user with no recorded
        turns gets honest zeros, never invented data.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: Insights report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsReport"
        "400":
          description: days outside 1..90
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
