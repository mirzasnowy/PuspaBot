# Rich cards in Chat API contract (rich cards in chat, plan section 12.10).
#
# Split out of docs/openapi-pwa.yaml on 21 Nov 2026 (rich cards in chat): the
# card contract (3 endpoints + 9 schemas) would have pushed the
# main spec past the 2000-line hard cap (earlier precedent:
# rooms, graph, mockup, payments, controls, voice, receipts,
# live-view, replay, and approval-overlay split the same way).
# The main spec references this file with $ref stubs and adds
# the optional `card` property to ChatMessage; the generated
# client is produced from the main spec with openapi-typescript,
# which resolves external $refs. The Error schema stays in the
# main spec and is referenced back from here.
#
# Honest scope, in the contract: a card is declarative JSON on
# a chat message — data describes the card, the renderer decides
# how to show it (the same split as the prompt-to-visual-mockup doc). The map
# card's tiles load client-side from free OpenStreetMap tiles
# (tile.openstreetmap.org, no API key); no live browser exists
# in this VM to prove a tile renders, so the contract promises
# correct tile URLs and marker/route coordinates, not a loaded
# tile in a real browser. The options card is a choice (tapping
# an option sends its label as a chat message), not a form:
# the interactive components (calculator, slider, form) are
# interactive components in chat, not this.
openapi: 3.0.3
info:
  title: PuspaBot rich cards in Chat API
  version: 1.0.0
paths:
  /api/chat/cards:
    post:
      tags: [chat-cards]
      summary: Post a rich card into the chat
      description: |
        rich cards in chat: validate one card payload (draft / options / chart
        / map) and append it as a `puspa` message carrying the
        card, so the Chat screen shows it in the thread. A bad
        card is a 400: unknown kind, bad coordinates, an empty
        draft body, fewer than 2 options, a negative chart
        value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCardRequest"
      responses:
        "200":
          description: The appended chat message, with its card
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/ChatMessage"
        "400":
          description: Bad card payload
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/chat/cards/draft/{draft_id}:
    post:
      tags: [chat-cards]
      summary: Show a stored co-drafting draft as a draft card in chat
      description: |
        rich cards in chat: build a draft card from the stored co-drafting draft and
        append it as a `puspa` chat message. An email draft
        carries a `mailto:` link (recipient + body); a message
        draft is copy-only. The draft text is never edited
        here: the card shows the draft as stored.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The appended chat message, with its draft card
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/ChatMessage"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown draft, or one that belongs to another user
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/chat/cards/insights:
    get:
      tags: [chat-cards]
      summary: Show the Insights report as a chart card in chat
      description: |
        rich cards in chat: build a chart card from the logged-in user's onboarding and cost insights
        Insights report (`activity_per_day`: every day in the
        window, including zero days, so the chart has no gaps)
        and append it as a `puspa` chat message. The metric
        defaults to cost, the number the Insights screen leads
        with.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
        - name: metric
          in: query
          required: false
          schema:
            type: string
            enum: [turns, tokens, cost_idr]
            default: cost_idr
      responses:
        "200":
          description: The appended chat message, with its chart card
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/ChatMessage"
        "400":
          description: Days outside 1..90, or an unknown metric
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
components:
  schemas:
    ChatCard:
      type: object
      description: |
        One rich card, as carried on a chat message. The `kind`
        field discriminates: `draft` (a draft email or message),
        `options` (a question with tappable options), `chart`
        (one metric per labelled point, drawn as bars), `map`
        (OSM tiles with markers and a route).
      oneOf:
        - $ref: "#/components/schemas/DraftCard"
        - $ref: "#/components/schemas/OptionsCard"
        - $ref: "#/components/schemas/ChartCard"
        - $ref: "#/components/schemas/MapCard"
      discriminator:
        propertyName: kind
        mapping:
          draft: "#/components/schemas/DraftCard"
          options: "#/components/schemas/OptionsCard"
          chart: "#/components/schemas/ChartCard"
          map: "#/components/schemas/MapCard"
    DraftCard:
      type: object
      description: |
        A draft email or message (co-drafting draft text): the body is
        copyable, and an email draft with a recipient carries a
        `mailto:` link that opens Mail with the body filled in.
        No subject is ever guessed: the link carries one only
        when the draft has one.
      properties:
        kind:
          type: string
          enum: [draft]
        title:
          type: string
        body:
          type: string
        channel:
          type: string
          enum: [email, message]
        draft_id:
          type: string
        recipient:
          type: string
        subject:
          type: string
        mailto:
          type: string
          description: mailto link (email channel with a recipient only)
      required: [kind, title, body, channel]
    CardOption:
      type: object
      description: One tappable option on an options card.
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
      required: [id, label]
    OptionsCard:
      type: object
      description: |
        A question with 2..8 tappable options. Tapping one
        sends its label as a chat message. A choice, not a
        form: interactive components are interactive components in chat.
      properties:
        kind:
          type: string
          enum: [options]
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/CardOption"
          minItems: 2
          maxItems: 8
      required: [kind, question, options]
    ChartPoint:
      type: object
      description: One labelled bar on a chart card.
      properties:
        label:
          type: string
        value:
          type: number
          minimum: 0
      required: [label, value]
    ChartCard:
      type: object
      description: |
        A small data chart: one metric per labelled point,
        drawn as bars. The points come from the onboarding and cost insights Insights
        report (`activity_per_day`); the metric is one of its
        fields.
      properties:
        kind:
          type: string
          enum: [chart]
        title:
          type: string
        metric:
          type: string
          enum: [turns, tokens, cost_idr]
        points:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
          minItems: 1
          maxItems: 90
      required: [kind, title, metric, points]
    MapPoint:
      type: object
      description: One latitude/longitude position on a map card.
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        label:
          type: string
      required: [lat, lon]
    MapCard:
      type: object
      description: |
        A map with markers and a route, drawn client-side from
        free OpenStreetMap tiles (tile.openstreetmap.org, no API
        key). `zoom` is an OSM zoom level (0..19). At least one
        marker or a route of 2+ points is required: a map with
        nothing on it is a blank tile grid.
      properties:
        kind:
          type: string
          enum: [map]
        title:
          type: string
        center:
          $ref: "#/components/schemas/MapPoint"
        zoom:
          type: integer
          minimum: 0
          maximum: 19
        markers:
          type: array
          items:
            $ref: "#/components/schemas/MapPoint"
        route:
          type: array
          items:
            $ref: "#/components/schemas/MapPoint"
      required: [kind, title, center, zoom, markers, route]
    ChatCardRequest:
      type: object
      description: Post one card into the chat (message text + card payload).
      properties:
        text:
          type: string
        card:
          $ref: "#/components/schemas/ChatCard"
      required: [text, card]
