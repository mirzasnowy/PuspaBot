# Shared-rooms API contract (B6 rooms, B9 delegation, B11 splits).
#
# Split out of docs/openapi-pwa.yaml on 19 Nov 2026 (Wave 30 ratchet
# fix): the rooms contract earned its own file once it passed 5
# endpoints + 5 schemas, and the main spec had crossed the 2000-line
# hard cap. The main spec references this file with $ref stubs; the
# generated client is produced from the main spec with
# openapi-typescript, which resolves external $refs. The Error schema
# stays in the main spec and is referenced back from here.
openapi: 3.0.3
info:
  title: Puspa shared rooms API
  version: 1.0.0
paths:
  /api/rooms:
    get:
      tags: [rooms]
      summary: List the logged-in user's shared rooms
      description: |
        B9: the rooms the user belongs to, with their role in
        each. A user with no rooms gets an empty list.
      responses:
        "200":
          description: The user's rooms
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomSummary"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/tasks:
    get:
      tags: [rooms]
      summary: Read the shared task board of one room
      description: |
        B9: every task of the room with owner, deadline, status,
        its delegation (null when never delegated), and how many
        steps wait for approval or execution. Only a room member
        may read the board.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The shared board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomBoard"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not a member of the room
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown room
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
    post:
      tags: [rooms]
      summary: Create a task on the shared board, optionally delegated
      description: |
        B9: creates the task on the B6 board and, when
        `delegate_kind` is given, hands it to the agent
        (`assignee_ref` is the subagent handle/id) or to a
        teammate (`assignee_ref` is the teammate user id) at
        once. A guest may never be handed work.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                owner_user_id:
                  type: string
                  format: uuid
                  nullable: true
                due_at:
                  type: string
                  format: date-time
                  nullable: true
                delegate_kind:
                  type: string
                  enum: [agent, teammate]
                assignee_ref:
                  type: string
      responses:
        "200":
          description: The created task, as a board row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomBoardTask"
        "400":
          description: Bad input (empty title, unknown delegate_kind)
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not a member of the room
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/tasks/{task_id}/steps:
    post:
      tags: [rooms]
      summary: Propose a step of work on a delegated task
      description: |
        B9: a reversible step is proposed and may run without
        approval. An irreversible step waits for the task owner
        to approve it; with no approval policy wired into the
        HTTP layer it stays awaiting approval and can never run
        (fail-closed).
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, tool_name]
              properties:
                description:
                  type: string
                tool_name:
                  type: string
                irreversible:
                  type: boolean
                  default: false
                content:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: The proposed step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedStep"
        "400":
          description: Bad input
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not a member of the room
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown task
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/tasks/{task_id}/steps/{step_id}/approve:
    post:
      tags: [rooms]
      summary: Approve a step waiting for approval
      description: |
        B9: only the task owner (or the creator when the task
        has no owner) may approve an irreversible step.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: step_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The decided step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedStepDecision"
        "400":
          description: The step is not awaiting approval
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not the task owner
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/tasks/{task_id}/steps/{step_id}/reject:
    post:
      tags: [rooms]
      summary: Reject a step waiting for approval
      description: |
        B9: only the task owner (or the creator when the task
        has no owner) may reject an irreversible step. A
        rejected step never runs.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: step_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The decided step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedStepDecision"
        "400":
          description: The step is not awaiting approval
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not the task owner
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/splits:
    get:
      tags: [rooms]
      summary: List the shared splits of one room
      description: |
        B11: every split of the room with each participant's
        share, paid, and remaining amounts (integer sen). Only
        a room member may read the splits.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The room's splits
          content:
            application/json:
              schema:
                type: object
                required: [splits]
                properties:
                  splits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Split"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not a room member
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown room
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
    post:
      tags: [rooms]
      summary: Create a shared split in one room
      description: |
        B11: split a bill among room members. Amounts are
        integer sen (1 rupiah = 100 sen). Shares default to
        equal; give `shares` (user id -> sen, summing to the
        total) or `weights` (one per participant) instead.
        The payer's own share is settled at creation.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, total_cents, payer_user_id, participant_user_ids]
              properties:
                title:
                  type: string
                total_cents:
                  type: integer
                  description: Total bill in integer sen.
                payer_user_id:
                  type: string
                  format: uuid
                participant_user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                kind:
                  type: string
                  enum: [meal, gift, arisan, other]
                  default: other
                shares:
                  type: object
                  additionalProperties:
                    type: integer
                weights:
                  type: array
                  items:
                    type: integer
                due_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: The created split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Split"
        "400":
          description: Bad input (shares do not sum to the total, guest participant, or a non-integer amount)
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not a room member, or a guest may not create a split
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/splits/{split_id}/payments:
    post:
      tags: [rooms]
      summary: Record a (partial) payment on a split
      description: |
        B11: record that a debtor paid part (or all) of what
        they still owe. The amount must be positive and no
        larger than the remaining balance; overpaying is a
        400, never credit.
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: split_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debtor_user_id, amount_cents]
              properties:
                debtor_user_id:
                  type: string
                  format: uuid
                amount_cents:
                  type: integer
      responses:
        "200":
          description: The recorded payment plus the updated split
          content:
            application/json:
              schema:
                type: object
                required: [id, split_id, debtor_user_id, amount_cents, recorded_by, created_at, split]
                properties:
                  id:
                    type: string
                    format: uuid
                  split_id:
                    type: string
                    format: uuid
                  debtor_user_id:
                    type: string
                    format: uuid
                  amount_cents:
                    type: integer
                  recorded_by:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
                  split:
                    $ref: "#/components/schemas/Split"
        "400":
          description: Overpayment, or a bad amount or debtor
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: Not a room member
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/rooms/{room_id}/splits/{split_id}/settlements/{debtor_user_id}/prepare:
    post:
      tags: [rooms]
      summary: Prepare (never execute) a debtor's settlement
      description: |
        B11 / B8 phase-1 seam: prepare a settlement payment
        (verified recipient = the payer, amount = what the
        debtor still owes, evidence = the split and its
        payments). The preparation is gated by the B6 money
        gate: the room owner passes alone, anyone else needs
        their own approval plus one other owner/member. The
        user pays in their own bank/e-wallet app; nothing
        executes here (`executed` is always false).
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: split_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: debtor_user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The prepared settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedSettlement"
        "400":
          description: Nothing left to settle, or the payer was given as debtor
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: The money gate has not approved this settlement
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/drafts:
    post:
      tags: [drafts]
      summary: Draft a message, document, or email in the user's voice
      description: |
        B13: the agent drafts in the user's recorded voice (greeting,
        closing, rules, preferences) and checks the brief against
        recorded past decisions. A draft whose brief contradicts a
        recorded decision is still created, but carries the decision
        in `decision_flags` as a warning — never a silent rewrite.
        Creating a draft never sends anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, brief]
              properties:
                kind:
                  type: string
                  enum: [message, document, email]
                brief:
                  type: string
                  description: What the draft should say, in the user's own words.
                recipient:
                  type: string
                  nullable: true
                  description: Who the draft is for (message/email), when known.
                channel:
                  type: string
                  nullable: true
                  description: Delivery channel the draft is meant for, when known.
      responses:
        "200":
          description: The created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Unknown kind or empty brief
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
    get:
      tags: [drafts]
      summary: List the logged-in user's drafts
      description: |
        B13: the user's drafts, oldest first.
      responses:
        "200":
          description: The user's drafts
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Draft"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/drafts/{draft_id}:
    get:
      tags: [drafts]
      summary: Read one draft
      description: |
        B13: one draft of the logged-in user.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown draft, or one that belongs to another user
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/drafts/{draft_id}/approve:
    post:
      tags: [drafts]
      summary: Approve a draft for sending
      description: |
        B13 / G4: the user's explicit approval to send this draft.
        Single-use, 24 hours, bound to the SHA-256 of the draft
        text right now; editing the draft afterwards voids it.
        Approving does not send anything.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recorded approval
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: "#/components/schemas/DraftApproval"
        "400":
          description: The draft was already sent
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown draft, or one that belongs to another user
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/drafts/{draft_id}/send:
    post:
      tags: [drafts]
      summary: Send an approved draft
      description: |
        B13 / G4: sends the draft through the app's delivery
        channel. Requires `approval_id` — a recorded approval
        for this exact draft text, granted by the draft owner,
        not expired, not already used. 403 when there is no
        usable approval; 501 when no delivery channel is wired
        into the app (the approval is kept, nothing is sent,
        nothing is claimed as sent). A draft never sends without
        approval.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              properties:
                approval_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The sent draft, the consumed approval, and the delivery result
          content:
            application/json:
              schema:
                type: object
                required: [draft, approval, delivery]
                properties:
                  draft:
                    $ref: "#/components/schemas/Draft"
                  approval:
                    $ref: "#/components/schemas/DraftApproval"
                  delivery:
                    type: object
                    description: Whatever the delivery channel returned.
        "400":
          description: Bad send body, or the draft was already sent
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "403":
          description: No usable approval for this draft text
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "404":
          description: Unknown draft, or one that belongs to another user
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "501":
          description: No delivery channel is wired into the app
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/voice/profile:
    get:
      tags: [drafts]
      summary: Read the user's voice profile
      description: |
        B13: the voice profile as the agent reads it from the
        user's memory facts — greeting, closing, parsed rules,
        style notes, preferences, and recorded decisions.
      responses:
        "200":
          description: The voice profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceProfile"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
  /api/voice/corrections:
    post:
      tags: [drafts]
      summary: Correct the user's voice
      description: |
        B13: records a voice correction as a memory fact
        (`voice.correction.<id>`, source user-confirmed), so
        later drafts change. The response carries the updated
        voice profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correction]
              properties:
                correction:
                  type: string
                  description: The correction in the user's own words.
      responses:
        "200":
          description: The recorded fact and the updated voice profile
          content:
            application/json:
              schema:
                type: object
                required: [fact, voice]
                properties:
                  fact:
                    type: object
                    description: The recorded memory fact.
                  voice:
                    $ref: "#/components/schemas/VoiceProfile"
        "400":
          description: Empty correction
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "./openapi-pwa.yaml#/components/schemas/Error"
components:
  schemas:
    RoomSummary:
      type: object
      description: |
        B9: one shared room the user belongs to, with their role
        in it.
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, member, guest]
    RoomBoardTask:
      type: object
      description: |
        B9: one row of the shared task board: the B6 task (owner,
        deadline, status) plus its delegation (null when the task
        was never delegated) and how many steps wait for approval
        or execution.
      required: [id, room_id, title, owner_user_id, due_at, status, created_by, created_at, completed_at, delegation, pending_steps]
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        title:
          type: string
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [open, done]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        delegation:
          type: object
          nullable: true
          required: [delegate_kind, assignee_ref, status, last_report, reported_at, started_at, blocked_reason]
          properties:
            delegate_kind:
              type: string
              enum: [agent, teammate]
            assignee_ref:
              type: string
              description: Subagent handle/id for an agent, user id for a teammate.
            status:
              type: string
              enum: [delegated, in_progress, awaiting_approval, blocked, done]
            last_report:
              type: string
              nullable: true
            reported_at:
              type: string
              format: date-time
              nullable: true
            started_at:
              type: string
              format: date-time
              nullable: true
            blocked_reason:
              type: string
              nullable: true
        pending_steps:
          type: integer
    RoomBoard:
      type: object
      description: |
        B9: the shared task board of one room.
      required: [room_id, room_name, tasks]
      properties:
        room_id:
          type: string
          format: uuid
        room_name:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/RoomBoardTask"
    DelegatedStep:
      type: object
      description: |
        B9: one proposed unit of work on a delegated task. An
        irreversible step may only run after the task owner
        approves it.
      required: [id, task_id, description, tool_name, irreversible, status, approval_request_id]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        description:
          type: string
        tool_name:
          type: string
        irreversible:
          type: boolean
        status:
          type: string
          enum: [proposed, awaiting_approval, approved, rejected, executed]
        approval_request_id:
          type: string
          nullable: true
    DelegatedStepDecision:
      type: object
      description: |
        B9: the outcome of approving or rejecting a step.
      required: [id, task_id, status]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [proposed, awaiting_approval, approved, rejected, executed]
    SplitShare:
      type: object
      description: |
        B11: one participant's share of a split: what they owe,
        what they paid, and what remains (all integer sen).
      required: [user_id, share_cents, paid_cents, remaining_cents, is_paid]
      properties:
        user_id:
          type: string
          format: uuid
        share_cents:
          type: integer
        paid_cents:
          type: integer
        remaining_cents:
          type: integer
        is_paid:
          type: boolean
    Split:
      type: object
      description: |
        B11: one shared bill split among room members. The
        payer fronted the total; their own share is settled at
        creation. Status moves open -> partially_paid ->
        settled as debtors pay.
      required: [id, room_id, title, kind, total_cents, payer_user_id, created_by, due_at, status, created_at, settled_at, shares]
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum: [meal, gift, arisan, other]
        total_cents:
          type: integer
          description: Total bill in integer sen (1 rupiah = 100 sen).
        payer_user_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        due_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [open, partially_paid, settled]
        created_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
          nullable: true
        shares:
          type: array
          items:
            $ref: "#/components/schemas/SplitShare"
    PreparedSettlement:
      type: object
      description: |
        B11 / B8 phase-1 seam: a prepared settlement payment.
        The user pays it in their own bank/e-wallet app;
        nothing executes here (`executed` is always false).
      required: [id, split_id, debtor_user_id, recipient_user_id, amount_cents, action_id, status, prepared_by, prepared_at, executed]
      properties:
        id:
          type: string
          format: uuid
        split_id:
          type: string
          format: uuid
        debtor_user_id:
          type: string
          format: uuid
        recipient_user_id:
          type: string
          format: uuid
          description: The payer of the split.
        amount_cents:
          type: integer
          description: What the debtor still owes, in integer sen.
        action_id:
          type: string
          description: The B6 money-gate action id that approved this preparation.
        status:
          type: string
          enum: [prepared, superseded]
        prepared_by:
          type: string
          format: uuid
        prepared_at:
          type: string
          format: date-time
        executed:
          type: boolean
          description: Always false — a prepared settlement never executes.
    Draft:
      type: object
      description: |
        B13: one draft in the user's voice. `decision_flags`
        are recorded past decisions the brief contradicts
        (a warning, never a silent rewrite);
        `related_decisions` are the decisions the brief
        touches; `voice_rules_applied` names the voice rules
        that shaped the text.
      required: [id, user_id, kind, brief, text, status, recipient, channel, decision_flags, related_decisions, voice_rules_applied, created_at, updated_at, sent_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, document, email]
        brief:
          type: string
        text:
          type: string
        status:
          type: string
          enum: [draft, approved, sent]
        recipient:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        decision_flags:
          type: array
          items:
            type: string
        related_decisions:
          type: array
          items:
            type: string
        voice_rules_applied:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
    DraftApproval:
      type: object
      description: |
        B13: one recorded approval to send a draft. Single-use,
        24 hours, bound to the SHA-256 of the draft text at
        approval time; editing the draft afterwards voids it.
      required: [id, draft_id, user_id, content_hash, status, granted_at, expires_at, consumed_at]
      properties:
        id:
          type: string
          format: uuid
        draft_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content_hash:
          type: string
          description: SHA-256 of the draft text at approval time.
        status:
          type: string
          enum: [granted, consumed]
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        consumed_at:
          type: string
          format: date-time
          nullable: true
    VoiceProfile:
      type: object
      description: |
        B13: the user's voice as the agent reads it from their
        memory facts — greeting, closing, parsed rules, style
        notes the parser could not apply mechanically,
        preferences, and recorded decisions.
      required: [user_id, greeting, closing, rules, style_notes, preferences, decisions]
      properties:
        user_id:
          type: string
          format: uuid
        greeting:
          type: string
          nullable: true
        closing:
          type: string
          nullable: true
        rules:
          type: array
          items:
            type: string
        style_notes:
          type: array
          items:
            type: string
        preferences:
          type: array
          items:
            type: string
        decisions:
          type: array
          items:
            type: string
