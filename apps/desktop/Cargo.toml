[package]
name = "puspabot-desktop"
version = "0.1.0"
edition = "2021"
description = "PuspaBot native desktop client (Rust + iced, no webview)"
license = "Apache-2.0"

[[bin]]
name = "puspabot"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
