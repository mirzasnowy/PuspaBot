<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Puspa - {{ layar | capitalize }}</title>
<link rel="manifest" href="/manifest.json">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; color: #1f2937; }
header { background: #0f766e; color: #fff; padding: 12px 16px; }
header a { color: #fff; margin-right: 12px; text-decoration: none; }
header a.aktif { font-weight: bold; text-decoration: underline; }
main { padding: 16px; max-width: 720px; margin: 0 auto; }
.kartu { border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; margin: 8px 0; }
.lencana { background: #ecfdf5; border: 1px solid #0f766e; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
button { background: #0f766e; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; }
input, select { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
.pesan-sub { opacity: 0.6; font-size: 13px; }
</style>
</head>
<body>
<header>
<strong>Puspa</strong>
<a href="/chat" class="{% if layar == 'chat' %}aktif{% endif %}">Chat</a>
<a href="/tugas" class="{% if layar == 'tugas' %}aktif{% endif %}">Tugas</a>
<a href="/modul" class="{% if layar == 'modul' %}aktif{% endif %}">Modul</a>
<a href="/konektor" class="{% if layar == 'konektor' %}aktif{% endif %}">Konektor</a>
<a href="/memori" class="{% if layar == 'memori' %}aktif{% endif %}">Memori</a>
<a href="/pengaturan" class="{% if layar == 'pengaturan' %}aktif{% endif %}">Pengaturan</a>
<a href="/kantor" class="{% if layar == 'kantor' %}aktif{% endif %}">Kantor</a>
</header>
<main>{% block isi %}{% endblock %}</main>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(function(){}); }
</script>
</body>
</html>
